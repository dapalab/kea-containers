// Functional smoke-test configuration. Not shipped in any image.
//
// dhcp-socket-type is set to "udp", so the test doesn't depend on raw
// sockets: perfdhcp sends directly to the server's address on a dedicated
// bridge network, which a UDP socket handles. That lets the test run in
// ordinary CI runners. The raw-socket path on a real network is a separate
// question, and not what this test checks.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "dhcp-socket-type": "udp",
      "service-sockets-max-retries": 5,
      "service-sockets-require-all": true
    },

    "lease-database": {
      "type": "memfile",
      "name": "/var/lib/kea/kea-leases4.csv",
      "persist": true
    },

    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/run/kea/control_socket_4"
      }
    ],

    "valid-lifetime": 600,
    "renew-timer": 300,
    "rebind-timer": 450,

    "subnet4": [
      {
        "id": 1,
        "subnet": "172.31.77.0/24",
        "pools": [ { "pool": "172.31.77.100 - 172.31.77.200" } ],
        "option-data": [
          { "name": "routers",             "data": "172.31.77.1" },
          { "name": "domain-name-servers", "data": "172.31.77.1" }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
