// Turning on the HTTP control API, safely.
//
// These images only enable the Unix control socket by default. (ISC's images
// listen on 0.0.0.0:8000, with a built-in password file containing
// api-user-name:api-user-password, which anyone can look up.)
//
// To use the REST API:
//   1. Create a password file on the host, mode 0600, owned by UID 10000,
//      with one "user:password" per line:
//        printf 'admin:%s\n' "$(openssl rand -base64 24)" > ./kea-api-password
//        sudo chown 10000:10000 ./kea-api-password && chmod 600 ./kea-api-password
//   2. Mount it read-only:
//        -v ./kea-api-password:/etc/kea/api-password:ro
//   3. Listen on an address only your management network can reach, rather
//      than 0.0.0.0, and add TLS if the traffic leaves the host.
{
  "Dhcp4": {
    "interfaces-config": { "interfaces": [ "eth0" ] },
    "lease-database": { "type": "memfile", "name": "/var/lib/kea/kea-leases4.csv" },

    "control-sockets": [
      { "socket-type": "unix", "socket-name": "/run/kea/control_socket_4" },
      {
        "socket-type": "http",
        "socket-address": "127.0.0.1",
        "socket-port": 8000,
        "authentication": {
          "type": "basic",
          "directory": "/etc/kea",
          "clients": [ { "password-file": "api-password" } ]
        }
      }
    ],

    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.50.0/24",
        "pools": [ { "pool": "192.168.50.100 - 192.168.50.200" } ]
      }
    ],

    "loggers": [
      { "name": "kea-dhcp4",
        "output_options": [ { "output": "stdout" } ],
        "severity": "INFO" }
    ]
  }
}
