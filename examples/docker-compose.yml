# DHCPv4, DHCPv6 and dynamic DNS, with the DHCP servers on a macvlan network.
#
# Change parent, the subnets and the gateways to match your network. The host
# itself can't reach macvlan containers through that interface (that's how
# macvlan works). If you need it to, use ipvlan, or add a macvlan "shim"
# interface on the host.
#
# The DHCP servers are also on the "internal" network, so they can send DNS
# updates to kea-dhcp-ddns at 172.20.0.5. That's the address the templates'
# commented dhcp-ddns example already uses as "server-ip"; in
# kea-dhcp-ddns.conf, set "ip-address" to 172.20.0.5 as well. (kea-dhcp-ddns
# will log DHCP_DDNS_NOT_ON_LOOPBACK as a reminder; that's expected here.)
services:
  kea-dhcp4:
    image: ghcr.io/dapalab/kea-dhcp4:3.2
    container_name: kea-dhcp4
    restart: unless-stopped
    networks:
      dhcp:
        ipv4_address: 192.168.50.2
      internal:
    volumes:
      - ./kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
      - leases4:/var/lib/kea

  kea-dhcp6:
    image: ghcr.io/dapalab/kea-dhcp6:3.2
    container_name: kea-dhcp6
    restart: unless-stopped
    networks:
      dhcp:
        ipv6_address: 2001:db8:1::2
      internal:
    volumes:
      - ./kea-dhcp6.conf:/etc/kea/kea-dhcp6.conf:ro
      - leases6:/var/lib/kea

  # DDNS doesn't need broadcasts: it talks to the DHCP servers and your DNS
  # server over ordinary UDP, so a plain bridge network is all it needs.
  kea-dhcp-ddns:
    image: ghcr.io/dapalab/kea-dhcp-ddns:3.2
    container_name: kea-dhcp-ddns
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.20.0.5
    volumes:
      - ./kea-dhcp-ddns.conf:/etc/kea/kea-dhcp-ddns.conf:ro

networks:
  dhcp:
    driver: macvlan
    driver_opts:
      parent: eth0
    enable_ipv6: true
    ipam:
      config:
        - subnet: 192.168.50.0/24
          gateway: 192.168.50.1
        - subnet: 2001:db8:1::/64
          gateway: 2001:db8:1::1
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  leases4:
  leases6:
