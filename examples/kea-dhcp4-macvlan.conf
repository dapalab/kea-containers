// A complete kea-dhcp4 example for a macvlan or ipvlan network.
//
// Change the interface name, subnet, pool and options to match your network.
// "eth0" is the interface as seen from inside the container, which on a
// macvlan network is the container's own interface, not the host's.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      // "raw" (the default) is what you want on a normal LAN: it lets Kea
      // hear broadcasts from clients that don't have an address yet. It
      // needs CAP_NET_RAW, which these images already have. Use "udp" only
      // if requests arrive through a relay or by unicast.
      "dhcp-socket-type": "raw",
      "service-sockets-max-retries": 5,
      "service-sockets-require-all": true
    },

    "lease-database": {
      "type": "memfile",
      "name": "/var/lib/kea/kea-leases4.csv",
      "persist": true,
      "lfc-interval": 3600
    },

    "control-sockets": [
      { "socket-type": "unix", "socket-name": "/run/kea/control_socket_4" }
    ],

    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,

    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.50.0/24",
        "pools": [ { "pool": "192.168.50.100 - 192.168.50.200" } ],
        "option-data": [
          { "name": "routers",             "data": "192.168.50.1" },
          { "name": "domain-name-servers", "data": "192.168.50.1, 1.1.1.1" },
          { "name": "domain-name",         "data": "lan.example" }
        ],
        "reservations": [
          {
            "hw-address": "aa:bb:cc:dd:ee:ff",
            "ip-address": "192.168.50.10",
            "hostname": "printer"
          }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [ { "output": "stdout", "pattern": "%-5p %m\n" } ],
        "severity": "INFO"
      }
    ]
  }
}
