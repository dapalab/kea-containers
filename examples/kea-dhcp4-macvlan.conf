// Working kea-dhcp4 example for a macvlan/ipvlan deployment.
//
// Adjust: the interface name, the subnet, the pool, and the option data.
// "eth0" is the interface INSIDE the container, which on a macvlan network is
// the container's own attachment - not the host's NIC name.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      // "raw" (the default) is correct on a real L2 segment: it lets Kea see
      // broadcast DHCPDISCOVER from clients that have no address yet.
      // Requires CAP_NET_RAW, which these images already grant via file
      // capabilities. Use "udp" only for relayed or unicast-only setups.
      "dhcp-socket-type": "raw",
      "service-sockets-max-retries": 5,
      "service-sockets-require-all": true
    },

    "lease-database": {
      "type": "memfile",
      "name": "/var/lib/kea/kea-leases4.csv",
      "persist": true,
      "lfc-interval": 3600
    },

    "control-sockets": [
      { "socket-type": "unix", "socket-name": "/run/kea/control_socket_4" }
    ],

    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,

    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.50.0/24",
        "pools": [ { "pool": "192.168.50.100 - 192.168.50.200" } ],
        "option-data": [
          { "name": "routers",             "data": "192.168.50.1" },
          { "name": "domain-name-servers", "data": "192.168.50.1, 1.1.1.1" },
          { "name": "domain-name",         "data": "lan.example" }
        ],
        "reservations": [
          {
            "hw-address": "aa:bb:cc:dd:ee:ff",
            "ip-address": "192.168.50.10",
            "hostname": "printer"
          }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [ { "output": "stdout", "pattern": "%-5p %m\n" } ],
        "severity": "INFO"
      }
    ]
  }
}
