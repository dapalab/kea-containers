// =============================================================================
// kea-dhcp-ddns <-> BIND9 with TSIG
// =============================================================================
//
// The usual way to do secure dynamic DNS with BIND9. It uses ordinary TSIG
// (RFC 2845) with a shared key, which is built into kea-dhcp-ddns. (GSS-TSIG,
// RFC 3645, is a different, Kerberos-based method used mainly with Active
// Directory DNS. BIND9 doesn't need it.)
//
// -----------------------------------------------------------------------------
// 1. Generate the key
// -----------------------------------------------------------------------------
//     tsig-keygen -a HMAC-SHA256 kea-ddns-key
//
//   Output looks like:
//     key "kea-ddns-key" {
//         algorithm hmac-sha256;
//         secret "8Xy...==";
//     };
//
// -----------------------------------------------------------------------------
// 2. BIND9 side - named.conf
// -----------------------------------------------------------------------------
//     key "kea-ddns-key" {
//         algorithm hmac-sha256;
//         secret "8Xy...==";
//     };
//
//     zone "lan.example" {
//         type master;
//         file "/var/lib/bind/db.lan.example";
//         allow-update { key "kea-ddns-key"; };
//     };
//
//     zone "1.168.192.in-addr.arpa" {
//         type master;
//         file "/var/lib/bind/db.192.168.1";
//         allow-update { key "kea-ddns-key"; };
//     };
//
//   BIND needs to be able to write to the zone files (it updates them), and
//   to their directory, where it keeps its journal files.
//
// -----------------------------------------------------------------------------
// 3. Kea side - the secret goes in its own file
// -----------------------------------------------------------------------------
//   Kea 3.x won't accept the secret written into this config ("use of clear
//   text TSIG 'secret' is NOT SECURE"), so save it to a file:
//
//     printf '%s' '8Xy...==' > ddns-key.secret
//     chmod 600 ddns-key.secret
//     sudo chown 10000:10000 ddns-key.secret
//
//     docker run -d --name kea-ddns \
//       -v ./kea-dhcp-ddns.conf:/etc/kea/kea-dhcp-ddns.conf:ro \
//       -v ./ddns-key.secret:/etc/kea/ddns-key.secret:ro \
//       --network internal \
//       ghcr.io/dapalab/kea-dhcp-ddns:3.2
//
// -----------------------------------------------------------------------------
// 4. Point kea-dhcp4 at it
// -----------------------------------------------------------------------------
//   In your kea-dhcp4.conf:
//
//     "dhcp-ddns": {
//       "enable-updates": true,
//       "server-ip": "172.20.0.5",   // this container's address
//       "server-port": 53001
//     },
//     "ddns-send-updates": true,
//     "ddns-qualifying-suffix": "lan.example",
//     "ddns-override-client-update": true,
//     "ddns-override-no-update": true
//
//   The ddns-override-* settings make a real difference. Without them, Kea
//   respects clients that ask not to be registered, or that want to update
//   DNS themselves, and some of your devices quietly go missing from the zone.
// =============================================================================
{
  "DhcpDdns": {

    // Listen on all interfaces, so the kea-dhcp4 container can reach this one.
    // Keep it on an internal Docker network: these requests aren't
    // authenticated.
    "ip-address": "0.0.0.0",
    "port": 53001,
    "dns-server-timeout": 2000,

    "control-sockets": [
      { "socket-type": "unix", "socket-name": "/run/kea/control_socket_d2" }
    ],

    "tsig-keys": [
      {
        "name": "kea-ddns-key",
        "algorithm": "HMAC-SHA256",
        "secret-file": "/etc/kea/ddns-key.secret"
      }
    ],

    // Forward zone: hostname -> A record.
    // "name" matches ddns-qualifying-suffix on the DHCP server, plus a dot.
    "forward-ddns": {
      "ddns-domains": [
        {
          "name": "lan.example.",
          "key-name": "kea-ddns-key",
          "dns-servers": [ { "ip-address": "192.168.1.1", "port": 53 } ]
        }
      ]
    },

    // Reverse zone: address -> PTR record.
    // For 192.168.1.0/24, the zone is the first three numbers, backwards.
    "reverse-ddns": {
      "ddns-domains": [
        {
          "name": "1.168.192.in-addr.arpa.",
          "key-name": "kea-ddns-key",
          "dns-servers": [ { "ip-address": "192.168.1.1", "port": 53 } ]
        }
      ]
    },

    "ncr-format": "JSON",
    "ncr-protocol": "UDP",

    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output_options": [ { "output": "stdout", "pattern": "%-5p [%c] %m\n" } ],
        // DEBUG is really useful while you're setting DDNS up: it logs each
        // update and the DNS server's reply.
        "severity": "INFO"
      }
    ]
  }
}
