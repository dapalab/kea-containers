// =============================================================================
// kea-dhcp-ddns <-> BIND9 with TSIG
// =============================================================================
//
// This is the normal way to do secure dynamic DNS with BIND9. It uses ordinary
// TSIG (RFC 2845) with a shared HMAC key, which is built into kea-dhcp-ddns.
// GSS-TSIG (RFC 3645) is a different, Kerberos-based mechanism used mainly
// with Active Directory DNS - you do not need it for BIND9.
//
// -----------------------------------------------------------------------------
// 1. Generate the key
// -----------------------------------------------------------------------------
//     tsig-keygen -a HMAC-SHA256 kea-ddns-key
//
//   Output looks like:
//     key "kea-ddns-key" {
//         algorithm hmac-sha256;
//         secret "8Xy...==";
//     };
//
// -----------------------------------------------------------------------------
// 2. BIND9 side - named.conf
// -----------------------------------------------------------------------------
//     key "kea-ddns-key" {
//         algorithm hmac-sha256;
//         secret "8Xy...==";
//     };
//
//     zone "lan.example" {
//         type master;
//         file "/var/lib/bind/db.lan.example";
//         allow-update { key "kea-ddns-key"; };
//     };
//
//     zone "1.168.192.in-addr.arpa" {
//         type master;
//         file "/var/lib/bind/db.192.168.1";
//         allow-update { key "kea-ddns-key"; };
//     };
//
//   The zone files must be writable by BIND (it rewrites them on update), and
//   the directory needs to be writable too so it can create journal files.
//
// -----------------------------------------------------------------------------
// 3. Kea side - the secret goes in a FILE, not this config
// -----------------------------------------------------------------------------
//   Kea 3.x rejects a clear-text "secret" with
//   "use of clear text TSIG 'secret' is NOT SECURE".
//
//     printf '%s' '8Xy...==' > ddns-key.secret
//     chmod 600 ddns-key.secret
//     sudo chown 10000:10000 ddns-key.secret
//
//     docker run -d --name kea-ddns \
//       -v ./kea-dhcp-ddns.conf:/etc/kea/kea-dhcp-ddns.conf:ro \
//       -v ./ddns-key.secret:/etc/kea/ddns-key.secret:ro \
//       --network internal \
//       ghcr.io/dapalab/kea-dhcp-ddns:3.2
//
// -----------------------------------------------------------------------------
// 4. Point kea-dhcp4 at it
// -----------------------------------------------------------------------------
//   In your kea-dhcp4.conf:
//
//     "dhcp-ddns": {
//       "enable-updates": true,
//       "server-ip": "172.20.0.5",   // this container's address
//       "server-port": 53001
//     },
//     "ddns-send-updates": true,
//     "ddns-qualifying-suffix": "lan.example",
//     "ddns-override-client-update": true,
//     "ddns-override-no-update": true
//
//   ddns-override-* matter in practice: without them, clients that ask not to
//   be registered (or insist on updating themselves) are honoured, and you get
//   a half-populated zone wondering why.
// =============================================================================
{
  "DhcpDdns": {

    // Bind to all interfaces so the kea-dhcp4 container can reach this one.
    // Keep it on an internal Docker network - the NCR channel is unauthenticated.
    "ip-address": "0.0.0.0",
    "port": 53001,
    "dns-server-timeout": 2000,

    "control-sockets": [
      { "socket-type": "unix", "socket-name": "/run/kea/control_socket_d2" }
    ],

    "tsig-keys": [
      {
        "name": "kea-ddns-key",
        "algorithm": "HMAC-SHA256",
        "secret-file": "/etc/kea/ddns-key.secret"
      }
    ],

    // Forward zone: hostname -> A record.
    // "name" must match ddns-qualifying-suffix on the DHCP server, with a dot.
    "forward-ddns": {
      "ddns-domains": [
        {
          "name": "lan.example.",
          "key-name": "kea-ddns-key",
          "dns-servers": [ { "ip-address": "192.168.1.1", "port": 53 } ]
        }
      ]
    },

    // Reverse zone: address -> PTR record.
    // For 192.168.1.0/24 the zone is the first three octets reversed.
    "reverse-ddns": {
      "ddns-domains": [
        {
          "name": "1.168.192.in-addr.arpa.",
          "key-name": "kea-ddns-key",
          "dns-servers": [ { "ip-address": "192.168.1.1", "port": 53 } ]
        }
      ]
    },

    "ncr-format": "JSON",
    "ncr-protocol": "UDP",

    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output_options": [ { "output": "stdout", "pattern": "%-5p [%c] %m\n" } ],
        // DEBUG here is genuinely useful while wiring DDNS up - it logs each
        // update attempt and the DNS server's response code.
        "severity": "INFO"
      }
    ]
  }
}
