# SPDX-License-Identifier: MPL-2.0
#
# kea-dhcp4 on Kubernetes, serving the node's network through hostNetwork.
#
# Each security setting below was tested against the published image. A few
# of them interact with the way these images get their permissions (and one
# common hardening step stops the server starting unless you add two
# capabilities back), so the comments explain each one.
#
# Why hostNetwork
#     A DHCP server has to hear broadcasts on the network it serves, and pod
#     networking doesn't carry them. hostNetwork puts the server on the
#     node's own interfaces, which is the simplest option on bare metal. A
#     DHCP relay pointing at a Service works too, and so does Multus with
#     macvlan if your cluster already has it.
#
#     The pod binds UDP port 67 on the node, so only one of these can run per
#     node, and nothing else on that node can use port 67.
#
# Why not a DaemonSet
#     A DaemonSet runs one copy per node. Several DHCP servers on the same
#     network, each with its own lease file, would hand out the same address
#     twice. So this runs one replica, pinned to one node. For high
#     availability, use Kea's own HA hook with a shared database (beyond the
#     scope of this example).
#
# Apply with:  kubectl apply -f kea-dhcp4.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kea-dhcp4-config
  labels: { app.kubernetes.io/name: kea-dhcp4 }
data:
  kea-dhcp4.conf: |
    {
      "Dhcp4": {
        // The node's interface on the network you're serving. "*" would
        // listen on every interface on the node, which is rarely what you want.
        "interfaces-config": {
          "interfaces": [ "eth0" ],
          "service-sockets-max-retries": 5,
          "service-sockets-require-all": true
        },

        // memfile needs a writable /var/lib/kea. On Kubernetes, that's the
        // PVC below (Kubernetes doesn't use the image's VOLUME setting; see
        // the note on volumes).
        "lease-database": {
          "type": "memfile",
          "name": "/var/lib/kea/kea-leases4.csv",
          "persist": true,
          "lfc-interval": 3600
        },

        "control-sockets": [
          { "socket-type": "unix", "socket-name": "/run/kea/control_socket_4" }
        ],

        "valid-lifetime": 3600,
        "renew-timer": 1800,
        "rebind-timer": 3150,

        "subnet4": [
          {
            "id": 1,
            "subnet": "192.168.50.0/24",
            "pools": [ { "pool": "192.168.50.100 - 192.168.50.200" } ],
            "option-data": [
              { "name": "routers",             "data": "192.168.50.1" },
              { "name": "domain-name-servers", "data": "192.168.50.1" }
            ]
          }
        ],

        "loggers": [
          {
            "name": "kea-dhcp4",
            "output_options": [ { "output": "stdout" } ],
            "severity": "INFO"
          }
        ]
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kea-dhcp4-leases
  labels: { app.kubernetes.io/name: kea-dhcp4 }
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
  # storageClassName: your-class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kea-dhcp4
  labels: { app.kubernetes.io/name: kea-dhcp4 }
spec:
  replicas: 1
  # With a ReadWriteOnce volume and a host port, the old pod has to stop
  # before the new one starts, or the new one can't bind the port or mount
  # the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: kea-dhcp4 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kea-dhcp4 }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # The pod binds UDP 67 on whichever node it lands on, so pin it.
      nodeSelector:
        kubernetes.io/hostname: CHANGE-ME-node-name

      securityContext:
        # Numeric, matching the image's USER 10000:10000. Kubernetes can only
        # check runAsNonRoot when the user is a number; with a user name it
        # can't tell, and refuses to start the pod.
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        # Makes the volume writable by group 10000. Without it, the lease
        # directory belongs to root and Kea can't write to it, so it stops at
        # startup.
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kea-dhcp4
          image: ghcr.io/dapalab/kea-dhcp4:3.2.0-20260920-2244
          # A stamped tag, which never changes. Version tags like 3.2.0 are
          # rebuilt every week. See docs/tags-and-updates.md.
          imagePullPolicy: IfNotPresent

          securityContext:
            # These images get their permissions from file capabilities on
            # the binary (cap_net_bind_service,cap_net_raw=ep), rather than
            # by running as root. Tested:
            #
            #   drop ALL, nothing added   -> "exec /usr/sbin/kea-dhcp4:
            #                                operation not permitted"
            #   drop ALL, add these two   -> works (CapEff 0x2400)
            #
            # "add" makes the capabilities available to the container, and
            # the file capabilities then let Kea use them. It needs both.
            capabilities:
              drop: [ "ALL" ]
              add:
                - NET_BIND_SERVICE   # bind UDP/67
                - NET_RAW            # the DHCPv4 broadcast path
            # Safe to use here, even though you might expect it to block file
            # capabilities (it sets NoNewPrivs). Tested with Docker's
            # equivalent, --security-opt no-new-privileges: CapEff stayed at
            # 0x2400 and Kea bound UDP port 67 normally.
            allowPrivilegeEscalation: false
            # Tested with the equivalent Docker run: Kea starts and reports
            # healthy with a read-only root filesystem, given the two
            # writable mounts below.
            readOnlyRootFilesystem: true

          # Kubernetes doesn't use the image's HEALTHCHECK, so it's repeated
          # here as probes: the same status-get check over the control socket
          # that the image uses.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                # Block scalar, because `*0` at the start of a YAML token is
                # parsed as an alias and the file will not load.
                - |
                  echo '{"command":"status-get"}' \
                    | nc -U -N -w3 /run/kea/control_socket_4 \
                    | grep -q '"result": *0'
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                # Block scalar, because `*0` at the start of a YAML token is
                # parsed as an alias and the file will not load.
                - |
                  echo '{"command":"status-get"}' \
                    | nc -U -N -w3 /run/kea/control_socket_4 \
                    | grep -q '"result": *0'
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }

          # The image declares VOLUME for /etc/kea and /var/lib/kea, but
          # that's a Docker feature: Kubernetes doesn't use it, so nothing is
          # kept or made writable because of it. Every writable path needs a
          # volume here, which is why /run/kea is listed even though it only
          # holds a socket.
          volumeMounts:
            - name: config
              mountPath: /etc/kea/kea-dhcp4.conf
              subPath: kea-dhcp4.conf
              readOnly: true
            - name: leases
              mountPath: /var/lib/kea
            - name: run
              mountPath: /run/kea

      volumes:
        - name: config
          configMap:
            name: kea-dhcp4-config
        - name: leases
          persistentVolumeClaim:
            claimName: kea-dhcp4-leases
        - name: run
          # Kea won't use a control-socket directory more open than 0750, so
          # a default emptyDir can't be shared around here. fsGroup above
          # gives group 10000 access to it.
          emptyDir: {}
