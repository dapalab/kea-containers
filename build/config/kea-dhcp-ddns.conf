// =============================================================================
// kea-dhcp-ddns configuration template
// =============================================================================
//
// SAFE AS-IS: no DDNS domains defined, so the daemon listens but forwards
// nothing. Fill in the domains and your DNS server before it does anything.
//
//     docker run --rm ghcr.io/dapalab/kea-dhcp-ddns:3.2 \
//       cat /etc/kea/kea-dhcp-ddns.conf > kea-dhcp-ddns.conf
//
// This daemon receives name-change requests from kea-dhcp4/kea-dhcp6 and turns
// them into DNS UPDATE messages (RFC 2136). Your DNS server must be willing to
// accept them - usually meaning a TSIG key and an allow-update policy.
//
// Reference: https://kea.readthedocs.io/en/kea-3.2.0/arm/ddns.html
// =============================================================================
{
  "DhcpDdns": {

    // Where this daemon listens for NCRs from the DHCP servers.
    //
    // 127.0.0.1 is safe but only reachable inside this container. To accept
    // requests from a kea-dhcp4 container, bind the address this container
    // holds on the shared network and point kea-dhcp4's "dhcp-ddns.server-ip"
    // at it. Do not expose this to an untrusted network - there is no
    // authentication on the NCR channel.
    "ip-address": "127.0.0.1",
    "port": 53001,
    "dns-server-timeout": 2000,

    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/run/kea/control_socket_d2"
      }
    ],

    // -------------------------------------------------------------------------
    // TSIG keys
    // -------------------------------------------------------------------------
    // Most DNS servers will not accept updates without one. Generate with:
    //     tsig-keygen -a HMAC-SHA256 kea-ddns-key
    //
    // Keep the secret OUT of the image. Mount this file at runtime, or
    // template it in from your secret store.
    //
    // "tsig-keys": [
    //   {
    //     "name": "kea-ddns-key",
    //     "algorithm": "HMAC-SHA256",
    //     "secret": "REPLACE_ME="
    //   }
    // ],

    // -------------------------------------------------------------------------
    // Forward zone: hostname -> address
    // -------------------------------------------------------------------------
    // "name" must end with a dot and must match the ddns-qualifying-suffix
    // you set on kea-dhcp4/6.
    "forward-ddns": {
      "ddns-domains": [
        // {
        //   "name": "lan.example.",
        //   "key-name": "kea-ddns-key",
        //   "dns-servers": [
        //     { "ip-address": "192.168.1.1", "port": 53 }
        //   ]
        // }
      ]
    },

    // -------------------------------------------------------------------------
    // Reverse zone: address -> hostname
    // -------------------------------------------------------------------------
    // The zone name is the network reversed. For 192.168.1.0/24 that is
    // "1.168.192.in-addr.arpa." - for IPv6 it is the nibble-reversed ip6.arpa
    // form, which is tedious but mechanical.
    "reverse-ddns": {
      "ddns-domains": [
        // {
        //   "name": "1.168.192.in-addr.arpa.",
        //   "key-name": "kea-ddns-key",
        //   "dns-servers": [
        //     { "ip-address": "192.168.1.1", "port": 53 }
        //   ]
        // }
      ]
    },

    "ncr-format": "JSON",
    "ncr-protocol": "UDP",

    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output_options": [
          { "output": "stdout", "pattern": "%-5p [%c] %m\n" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
