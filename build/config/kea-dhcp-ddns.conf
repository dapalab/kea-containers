// =============================================================================
// kea-dhcp-ddns configuration template
// =============================================================================
//
// Safe to run as it is: there are no DNS zones yet, so it listens but doesn't
// update anything. Add your zones and DNS server below to get it going.
//
//     docker run --rm ghcr.io/dapalab/kea-dhcp-ddns:3.2 \
//       cat /etc/kea/kea-dhcp-ddns.conf > kea-dhcp-ddns.conf
//
// This server receives name-change requests from kea-dhcp4 and kea-dhcp6 and
// turns them into DNS updates (RFC 2136). Your DNS server needs to accept
// them, which usually means a TSIG key and an allow-update rule.
//
// Reference: https://kea.readthedocs.io/en/kea-3.2.0/arm/ddns.html
// =============================================================================
{
  "DhcpDdns": {

    // Where this server listens for requests from the DHCP servers.
    //
    // 127.0.0.1 is only reachable from inside this container. To accept
    // requests from a kea-dhcp4 container, use this container's address on the
    // network they share, and set kea-dhcp4's "dhcp-ddns.server-ip" to match.
    // Keep it off untrusted networks: these requests aren't authenticated.
    "ip-address": "127.0.0.1",
    "port": 53001,
    "dns-server-timeout": 2000,

    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/run/kea/control_socket_d2"
      }
    ],

    // -------------------------------------------------------------------------
    // TSIG keys
    // -------------------------------------------------------------------------
    // BIND9 and most other DNS servers need one before they'll accept dynamic
    // updates. This is ordinary TSIG (RFC 2845) with a shared key, and it's
    // built into this server, so there's no hook library to load.
    //
    // Generate a key:
    //     tsig-keygen -a HMAC-SHA256 kea-ddns-key
    //
    // Kea 3.x won't accept the secret written directly into the config:
    //     use of clear text TSIG 'secret' is NOT SECURE
    // Put it in a file instead, and point "secret-file" at it. The file holds
    // just the base64 secret, with no key name and no trailing newline:
    //
    //     printf '%s' 'YOUR_BASE64_SECRET' > ddns-key.secret
    //     chmod 600 ddns-key.secret && sudo chown 10000:10000 ddns-key.secret
    //     docker run -v ./ddns-key.secret:/etc/kea/ddns-key.secret:ro ...
    //
    // "tsig-keys": [
    //   {
    //     "name": "kea-ddns-key",
    //     "algorithm": "HMAC-SHA256",
    //     "secret-file": "/etc/kea/ddns-key.secret"
    //   }
    // ],

    // -------------------------------------------------------------------------
    // Forward zone: hostname -> address
    // -------------------------------------------------------------------------
    // "name" ends with a dot, and should match the ddns-qualifying-suffix you
    // set in kea-dhcp4 and kea-dhcp6.
    "forward-ddns": {
      "ddns-domains": [
        // {
        //   "name": "lan.example.",
        //   "key-name": "kea-ddns-key",
        //   "dns-servers": [
        //     { "ip-address": "192.168.1.1", "port": 53 }
        //   ]
        // }
      ]
    },

    // -------------------------------------------------------------------------
    // Reverse zone: address -> hostname
    // -------------------------------------------------------------------------
    // The zone name is the network written backwards. For 192.168.1.0/24
    // that's "1.168.192.in-addr.arpa.". For IPv6 it's the ip6.arpa form, one
    // hex digit at a time, reversed: long, but straightforward.
    "reverse-ddns": {
      "ddns-domains": [
        // {
        //   "name": "1.168.192.in-addr.arpa.",
        //   "key-name": "kea-ddns-key",
        //   "dns-servers": [
        //     { "ip-address": "192.168.1.1", "port": 53 }
        //   ]
        // }
      ]
    },

    "ncr-format": "JSON",
    "ncr-protocol": "UDP",

    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output_options": [
          { "output": "stdout", "pattern": "%-5p [%c] %m\n" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
