// Default kea-dhcp-ddns configuration shipped in the image.
//
// DELIBERATELY INERT: no DDNS domains are configured, so the daemon starts and
// listens but forwards nothing. Mount your own config over
// /etc/kea/kea-dhcp-ddns.conf. See config/examples/ in the repository.
{
  "DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,
    "dns-server-timeout": 2000,

    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/run/kea/control_socket_d2"
      }
    ],

    "forward-ddns": { "ddns-domains": [] },
    "reverse-ddns": { "ddns-domains": [] },

    "ncr-format": "JSON",
    "ncr-protocol": "UDP",

    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output_options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
