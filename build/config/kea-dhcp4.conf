// =============================================================================
// kea-dhcp4 configuration template
// =============================================================================
//
// This file ships inside the image and is SAFE AS-IS: no subnets are defined,
// so the daemon starts, logs, and answers its control socket but will never
// offer a lease. Nothing happens on your network until you fill in a subnet.
//
// To use it as your starting point:
//
//     docker run --rm ghcr.io/dapalab/kea-dhcp4:3.2 \
//       cat /etc/kea/kea-dhcp4.conf > kea-dhcp4.conf
//     $EDITOR kea-dhcp4.conf
//     docker run -v ./kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro ...
//
// Kea accepts // and /* */ comments, so you can uncomment blocks in place.
// Validate before deploying:
//
//     docker run --rm -v ./kea-dhcp4.conf:/tmp/c.conf:ro \
//       ghcr.io/dapalab/kea-dhcp4:3.2 kea-dhcp4 -t /tmp/c.conf
//
// Full reference: https://kea.readthedocs.io/en/kea-3.2.0/arm/dhcp4-srv.html
// =============================================================================
{
  "Dhcp4": {

    // -------------------------------------------------------------------------
    // Interfaces
    // -------------------------------------------------------------------------
    // "eth0" is the interface INSIDE the container. On a macvlan/ipvlan network
    // that is the container's own attachment, not the host's NIC name. With
    // --network host it IS the host's interface name.
    //
    // dhcp-socket-type:
    //   "raw" - required on a real L2 segment. Lets Kea see broadcast
    //           DHCPDISCOVER from clients that have no address yet.
    //           Needs CAP_NET_RAW, which this image already grants.
    //   "udp" - only for relayed or unicast-only setups. Cannot answer
    //           clients that are broadcasting.
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "dhcp-socket-type": "raw",
      "service-sockets-max-retries": 5,
      "service-sockets-require-all": true
    },

    // -------------------------------------------------------------------------
    // Lease storage
    // -------------------------------------------------------------------------
    // memfile is a CSV on disk. Mount /var/lib/kea as a volume or your leases
    // die with the container. The directory must be writable by UID 10000.
    //
    // lfc-interval compacts the CSV every N seconds (3600 = hourly). Without
    // it the file grows forever.
    "lease-database": {
      "type": "memfile",
      "name": "/var/lib/kea/kea-leases4.csv",
      "persist": true,
      "lfc-interval": 3600
    },

    // -------------------------------------------------------------------------
    // Lease timers
    // -------------------------------------------------------------------------
    // valid-lifetime : how long a lease is good for
    // renew-timer    : client tries to renew at this point (T1, ~50%)
    // rebind-timer   : client tries any server at this point (T2, ~87.5%)
    //
    // 4 hours suits a homelab. Shorten it while you are still changing things
    // so clients pick up new options quickly; lengthen it once stable.
    "valid-lifetime": 14400,
    "renew-timer": 7200,
    "rebind-timer": 12600,

    // -------------------------------------------------------------------------
    // Control socket
    // -------------------------------------------------------------------------
    // Unix socket only by default. Query it with the netcat already in the
    // image - no extra tooling needed:
    //
    //   docker exec kea4 sh -c \
    //     'echo "{\"command\":\"status-get\"}" | nc -U -N -w3 /run/kea/control_socket_4'
    //
    // To expose the HTTP API instead, see examples/kea-dhcp4-http-control.conf.
    // Never ship a password file inside an image.
    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/run/kea/control_socket_4"
      }
    ],

    // -------------------------------------------------------------------------
    // Options served to every subnet
    // -------------------------------------------------------------------------
    // Per-subnet option-data overrides anything set here.
    //
    // "option-data": [
    //   { "name": "domain-name-servers", "data": "192.168.1.1, 1.1.1.1" },
    //   { "name": "domain-name",         "data": "lan.example" },
    //   { "name": "domain-search",       "data": "lan.example" },
    //   { "name": "ntp-servers",         "data": "192.168.1.1" }
    // ],

    // -------------------------------------------------------------------------
    // Subnets  <-- THE PART YOU MUST FILL IN
    // -------------------------------------------------------------------------
    // Empty on purpose. Replace with the commented example below, adjusted to
    // your network. "id" must be unique and stable - changing it orphans the
    // existing leases for that subnet.
    //
    // Keep the pool clear of anything with a static address: your router,
    // switches, APs, and anything you reserve below.
    "subnet4": [

      // {
      //   "id": 1,
      //   "subnet": "192.168.1.0/24",
      //   "pools": [ { "pool": "192.168.1.100 - 192.168.1.199" } ],
      //
      //   "option-data": [
      //     { "name": "routers",             "data": "192.168.1.1" },
      //     { "name": "domain-name-servers", "data": "192.168.1.1" },
      //     { "name": "domain-name",         "data": "lan.example" }
      //   ],
      //
      //   // Static assignments. These do NOT need to sit inside the pool -
      //   // in fact it is cleaner if they sit outside it.
      //   //
      //   // Match on hw-address (MAC), or on client-id / flex-id if you use
      //   // the flex_id hook. hostname is optional but feeds DDNS.
      //   "reservations": [
      //     {
      //       "hw-address": "aa:bb:cc:dd:ee:01",
      //       "ip-address": "192.168.1.10",
      //       "hostname": "nas"
      //     },
      //     {
      //       "hw-address": "aa:bb:cc:dd:ee:02",
      //       "ip-address": "192.168.1.11",
      //       "hostname": "printer",
      //       // Per-reservation options override the subnet's.
      //       "option-data": [
      //         { "name": "domain-name-servers", "data": "9.9.9.9" }
      //       ]
      //     }
      //   ]
      // }

    ],

    // -------------------------------------------------------------------------
    // Reservations that apply regardless of subnet
    // -------------------------------------------------------------------------
    // Useful for a laptop that roams between VLANs. Requires the lookup to be
    // enabled, which costs a little performance.
    //
    // "reservations-global": true,
    // "reservations-in-subnet": true,
    // "reservations": [
    //   { "hw-address": "aa:bb:cc:dd:ee:03", "hostname": "laptop" }
    // ],

    // -------------------------------------------------------------------------
    // Dynamic DNS
    // -------------------------------------------------------------------------
    // Hands hostnames to kea-dhcp-ddns, which updates your DNS server. Run the
    // ghcr.io/dapalab/kea-dhcp-ddns image and point server-ip at it.
    //
    // "dhcp-ddns": {
    //   "enable-updates": true,
    //   "server-ip": "172.20.0.5",
    //   "server-port": 53001
    // },
    // "ddns-send-updates": true,
    // "ddns-override-client-update": true,
    // "ddns-override-no-update": true,
    // "ddns-qualifying-suffix": "lan.example",

    // -------------------------------------------------------------------------
    // Hook libraries
    // -------------------------------------------------------------------------
    // All open-source hooks are present at /usr/lib/kea/hooks/. The ones a
    // homelab actually tends to want:
    //
    //   lease_cmds  - query and manipulate leases over the control API
    //                 (lease4-get-all, lease4-del, ...). Very handy.
    //   ha          - active/standby or load-balanced pair of servers
    //   flex_id     - identify clients by something other than MAC
    //   run_script  - fire a script on lease events
    //   ping_check  - ICMP the address before offering it
    //   subnet_cmds - add/remove subnets at runtime, no restart
    //
    // "hooks-libraries": [
    //   { "library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so" }
    // ],

    // -------------------------------------------------------------------------
    // Logging
    // -------------------------------------------------------------------------
    // stdout so `docker logs` works. Raise to DEBUG (with debuglevel 0-99)
    // while troubleshooting; INFO is right for normal running.
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          {
            "output": "stdout",
            "pattern": "%-5p [%c] %m\n"
          }
        ],
        "severity": "INFO"
        // "severity": "DEBUG", "debuglevel": 40
      }
    ]
  }
}
