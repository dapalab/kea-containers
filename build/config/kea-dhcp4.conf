// =============================================================================
// kea-dhcp4 configuration template
// =============================================================================
//
// This file ships inside the image, and it's safe to run as it is: there are
// no subnets yet, so Kea starts, logs, and answers its control socket, but
// won't hand out any addresses until you add a subnet below.
//
// To use it as your starting point:
//
//     docker run --rm ghcr.io/dapalab/kea-dhcp4:3.2 \
//       cat /etc/kea/kea-dhcp4.conf > kea-dhcp4.conf
//     $EDITOR kea-dhcp4.conf
//     docker run -v ./kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro ...
//
// Kea understands // and /* */ comments, so you can uncomment blocks where
// they are. Check your changes before using them:
//
//     docker run --rm -v ./kea-dhcp4.conf:/tmp/c.conf:ro \
//       ghcr.io/dapalab/kea-dhcp4:3.2 kea-dhcp4 -t /tmp/c.conf
//
// Full reference: https://kea.readthedocs.io/en/kea-3.2.0/arm/dhcp4-srv.html
// =============================================================================
{
  "Dhcp4": {

    // -------------------------------------------------------------------------
    // Interfaces
    // -------------------------------------------------------------------------
    // "eth0" is the interface as seen from inside the container. On a macvlan
    // or ipvlan network, that's the container's own interface, not the host's.
    // With --network host, use the host's real interface name.
    //
    // dhcp-socket-type:
    //   "raw" - what you want on a normal LAN. It lets Kea hear broadcasts
    //           from clients that don't have an address yet. It needs
    //           CAP_NET_RAW, which this image already has.
    //   "udp" - only for setups where requests arrive through a relay or by
    //           unicast. It can't answer clients that are broadcasting.
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "dhcp-socket-type": "raw",
      "service-sockets-max-retries": 5,
      "service-sockets-require-all": true
    },

    // -------------------------------------------------------------------------
    // Lease storage
    // -------------------------------------------------------------------------
    // "memfile" keeps leases in a CSV file. Mount a volume at /var/lib/kea so
    // your leases survive the container being replaced. The directory needs
    // to be writable by UID 10000 (a named volume takes care of that).
    //
    // lfc-interval tidies up the CSV file every N seconds (3600 = hourly), so
    // it doesn't keep growing.
    //
    // Using MySQL or PostgreSQL instead? Both are built into these images, but
    // in Kea 3.x each database backend is a hook library, so you need to load
    // the hook as well as setting the type. Otherwise Kea won't accept the
    // config:
    //
    //   "hooks-libraries": [
    //     { "library": "/usr/lib/kea/hooks/libdhcp_mysql.so" }
    //   ],
    //   "lease-database": {
    //     "type": "mysql",
    //     "name": "kea", "host": "db-host", "user": "kea",
    //     "password": "CHANGEME"
    //   }
    //
    // Kea reads the database password from here, so keep this file private
    // (readable only by UID 10000). For PostgreSQL, use libdhcp_pgsql.so and
    // "type": "postgresql".
    // (That's also why `kea-dhcp4 -V` lists only memfile until a hook is
    // loaded: it shows the backends that are loaded, not the ones built in.
    // `kea-dhcp4 -W` shows what was built in.)
    //
    // Set up the database first with kea-admin, from the kea-tools image:
    //   kea-admin db-init mysql -h <host> -u <user> -p <password> -n <db>
    "lease-database": {
      "type": "memfile",
      "name": "/var/lib/kea/kea-leases4.csv",
      "persist": true,
      "lfc-interval": 3600
    },

    // -------------------------------------------------------------------------
    // Lease timers
    // -------------------------------------------------------------------------
    // valid-lifetime : how long a lease is good for
    // renew-timer    : client tries to renew at this point (T1, ~50%)
    // rebind-timer   : client tries any server at this point (T2, ~87.5%)
    //
    // 4 hours suits most home networks. While you're still changing things,
    // a shorter time means clients pick up new settings sooner; lengthen it
    // again once things are settled.
    "valid-lifetime": 14400,
    "renew-timer": 7200,
    "rebind-timer": 12600,

    // -------------------------------------------------------------------------
    // Control socket
    // -------------------------------------------------------------------------
    // A Unix socket, for talking to Kea from inside the container. The image
    // includes netcat, so you don't need anything else:
    //
    //   docker exec kea4 sh -c \
    //     'echo "{\"command\":\"status-get\"}" | nc -U -N -w3 /run/kea/control_socket_4'
    //
    // For the HTTP API as well, see examples/kea-dhcp4-http-control.conf. Keep
    // its password file outside the image, and mount it in.
    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/run/kea/control_socket_4"
      }
    ],

    // -------------------------------------------------------------------------
    // Options served to every subnet
    // -------------------------------------------------------------------------
    // Options set on a subnet take priority over these.
    //
    // "option-data": [
    //   { "name": "domain-name-servers", "data": "192.168.1.1, 1.1.1.1" },
    //   { "name": "domain-name",         "data": "lan.example" },
    //   { "name": "domain-search",       "data": "lan.example" },
    //   { "name": "ntp-servers",         "data": "192.168.1.1" }
    // ],

    // -------------------------------------------------------------------------
    // Subnets  <-- start here
    // -------------------------------------------------------------------------
    // Empty on purpose. Uncomment the example below and adjust it to your
    // network. Each subnet's "id" should be unique and never change: Kea uses
    // it to match existing leases to their subnet.
    //
    // Keep the pool clear of anything with a fixed address: your router,
    // switches, access points, and any reservations below.
    "subnet4": [

      // {
      //   "id": 1,
      //   "subnet": "192.168.1.0/24",
      //   "pools": [ { "pool": "192.168.1.100 - 192.168.1.199" } ],
      //
      //   "option-data": [
      //     { "name": "routers",             "data": "192.168.1.1" },
      //     { "name": "domain-name-servers", "data": "192.168.1.1" },
      //     { "name": "domain-name",         "data": "lan.example" }
      //   ],
      //
      //   // Fixed addresses for particular devices. These don't need to be
      //   // inside the pool, and it's tidier if they aren't.
      //   //
      //   // Match on hw-address (MAC), or on client-id / flex-id if you use
      //   // the flex_id hook. "hostname" is optional, and is used for DDNS.
      //   "reservations": [
      //     {
      //       "hw-address": "aa:bb:cc:dd:ee:01",
      //       "ip-address": "192.168.1.10",
      //       "hostname": "nas"
      //     },
      //     {
      //       "hw-address": "aa:bb:cc:dd:ee:02",
      //       "ip-address": "192.168.1.11",
      //       "hostname": "printer",
      //       // Options here take priority over the subnet's.
      //       "option-data": [
      //         { "name": "domain-name-servers", "data": "9.9.9.9" }
      //       ]
      //     }
      //   ]
      // }

    ],

    // -------------------------------------------------------------------------
    // Reservations that apply in any subnet
    // -------------------------------------------------------------------------
    // Handy for a laptop that moves between VLANs. You need to switch the
    // lookup on, which costs a little performance.
    //
    // "reservations-global": true,
    // "reservations-in-subnet": true,
    // "reservations": [
    //   { "hw-address": "aa:bb:cc:dd:ee:03", "hostname": "laptop" }
    // ],

    // -------------------------------------------------------------------------
    // Dynamic DNS
    // -------------------------------------------------------------------------
    // Sends hostnames to kea-dhcp-ddns, which updates your DNS server. Run the
    // ghcr.io/dapalab/kea-dhcp-ddns image and set server-ip to its address.
    //
    // "dhcp-ddns": {
    //   "enable-updates": true,
    //   "server-ip": "172.20.0.5",
    //   "server-port": 53001
    // },
    // "ddns-send-updates": true,
    // "ddns-override-client-update": true,
    // "ddns-override-no-update": true,
    // "ddns-qualifying-suffix": "lan.example",

    // -------------------------------------------------------------------------
    // Hook libraries
    // -------------------------------------------------------------------------
    // All of Kea's open-source hooks are in /usr/lib/kea/hooks/. The ones
    // people most often find useful at home:
    //
    //   lease_cmds  - query and manipulate leases over the control API
    //                 (lease4-get-all, lease4-del, ...)
    //   ha          - active/standby or load-balanced pair of servers
    //   flex_id     - identify clients by something other than MAC
    //   run_script  - fire a script on lease events
    //   ping_check  - ICMP the address before offering it
    //   subnet_cmds - add/remove subnets at runtime, no restart
    //
    // "hooks-libraries": [
    //   { "library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so" }
    // ],

    // -------------------------------------------------------------------------
    // Logging
    // -------------------------------------------------------------------------
    // Logs go to stdout, so `docker logs` shows them. Switch to DEBUG (with a
    // debuglevel from 0 to 99) while troubleshooting; INFO is right the rest
    // of the time.
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          {
            "output": "stdout",
            "pattern": "%-5p [%c] %m\n"
          }
        ],
        "severity": "INFO"
        // "severity": "DEBUG", "debuglevel": 40
      }
    ]
  }
}
