// Default kea-dhcp6 configuration shipped in the image.
//
// DELIBERATELY INERT: no subnets are defined, so the daemon starts, logs and
// answers the control socket, but will not offer a lease to anything. Mount
// your own config over /etc/kea/kea-dhcp6.conf before putting this on a real
// network. See config/examples/ in the repository for working configurations.
//
// This is a deviation from ISC's image, which ships a live 2001:db8::/64
// pool bound to eth0. A DHCP server that starts up already willing to hand out
// addresses is a poor default for an image people will run on macvlan.
{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": [],
      "service-sockets-max-retries": 5,
      "service-sockets-require-all": true
    },

    "lease-database": {
      "type": "memfile",
      "name": "/var/lib/kea/kea-leases6.csv"
    },

    // Unix control socket only. ISC additionally exposes an HTTP socket on
    // 0.0.0.0:8000 guarded by a password file that ships inside the image with
    // the literal credentials api-user-name:api-user-password. We do not ship
    // credentials. To enable the HTTP control channel, add an entry here with
    // your own authentication block - see docs/ in the repository.
    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/run/kea/control_socket_6"
      }
    ],

    "subnet6": [],

    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
