// =============================================================================
// kea-dhcp6 configuration template
// =============================================================================
//
// SAFE AS-IS: no subnets defined, so nothing is served until you fill one in.
//
//     docker run --rm ghcr.io/dapalab/kea-dhcp6:3.2 \
//       cat /etc/kea/kea-dhcp6.conf > kea-dhcp6.conf
//
// Reference: https://kea.readthedocs.io/en/kea-3.2.0/arm/dhcp6-srv.html
// =============================================================================
{
  "Dhcp6": {

    // DHCPv6 uses UDP multicast (ff02::1:2) on port 547 - no raw sockets, so
    // this image needs only CAP_NET_BIND_SERVICE.
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "service-sockets-max-retries": 5,
      "service-sockets-require-all": true
    },

    "lease-database": {
      "type": "memfile",
      "name": "/var/lib/kea/kea-leases6.csv",
      "persist": true,
      "lfc-interval": 3600
    },

    // preferred-lifetime should be well under valid-lifetime: it is the point
    // at which the address becomes "deprecated" and clients stop starting new
    // connections with it.
    "preferred-lifetime": 7200,
    "valid-lifetime": 14400,
    "renew-timer": 3600,
    "rebind-timer": 5400,

    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/run/kea/control_socket_6"
      }
    ],

    // -------------------------------------------------------------------------
    // Subnets  <-- FILL THIS IN
    // -------------------------------------------------------------------------
    // Note that in IPv6 most hosts will also be doing SLAAC. Decide whether you
    // want DHCPv6 for addressing (M flag in your router advertisements) or only
    // for options like DNS (O flag). Kea does not send RAs - your router does.
    "subnet6": [

      // {
      //   "id": 1,
      //   "subnet": "2001:db8:1::/64",
      //   "pools": [ { "pool": "2001:db8:1::100 - 2001:db8:1::1ff" } ],
      //
      //   // Prefix delegation: hand whole /64s to downstream routers.
      //   // Drop this block if you are not subdelegating.
      //   "pd-pools": [
      //     {
      //       "prefix": "2001:db8:2::",
      //       "prefix-len": 48,
      //       "delegated-len": 64
      //     }
      //   ],
      //
      //   "option-data": [
      //     { "name": "dns-servers",   "data": "2001:db8:1::1" },
      //     { "name": "domain-search", "data": "lan.example" }
      //   ],
      //
      //   // DHCPv6 identifies clients by DUID, not MAC. A DUID is not stable
      //   // across OS reinstalls, which makes v6 reservations more fragile
      //   // than v4 ones. hw-address works if your clients send it.
      //   "reservations": [
      //     {
      //       "duid": "01:02:03:04:05:06:07:08",
      //       "ip-addresses": [ "2001:db8:1::10" ],
      //       "hostname": "nas"
      //     }
      //   ]
      // }

    ],

    // "dhcp-ddns": {
    //   "enable-updates": true,
    //   "server-ip": "172.20.0.5",
    //   "server-port": 53001
    // },
    // "ddns-send-updates": true,
    // "ddns-qualifying-suffix": "lan.example",

    // Hooks live at /usr/lib/kea/hooks/. lease_cmds and ha are the usual ones.
    // "hooks-libraries": [
    //   { "library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so" }
    // ],

    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [
          { "output": "stdout", "pattern": "%-5p [%c] %m\n" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
