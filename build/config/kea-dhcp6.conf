// =============================================================================
// kea-dhcp6 configuration template
// =============================================================================
//
// Safe to run as it is: there are no subnets yet, so nothing is handed out
// until you add one.
//
//     docker run --rm ghcr.io/dapalab/kea-dhcp6:3.2 \
//       cat /etc/kea/kea-dhcp6.conf > kea-dhcp6.conf
//
// Reference: https://kea.readthedocs.io/en/kea-3.2.0/arm/dhcp6-srv.html
// =============================================================================
{
  "Dhcp6": {

    // DHCPv6 uses UDP multicast (ff02::1:2) on port 547 rather than raw
    // sockets, so this image only needs CAP_NET_BIND_SERVICE.
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "service-sockets-max-retries": 5,
      "service-sockets-require-all": true
    },

    "lease-database": {
      "type": "memfile",
      "name": "/var/lib/kea/kea-leases6.csv",
      "persist": true,
      "lfc-interval": 3600
    },

    // Keep preferred-lifetime well under valid-lifetime. It's when an address
    // becomes "deprecated", and clients stop starting new connections with it.
    "preferred-lifetime": 7200,
    "valid-lifetime": 14400,
    "renew-timer": 3600,
    "rebind-timer": 5400,

    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/run/kea/control_socket_6"
      }
    ],

    // -------------------------------------------------------------------------
    // Subnets  <-- start here
    // -------------------------------------------------------------------------
    // With IPv6, most devices also configure themselves with SLAAC. So decide
    // whether you want DHCPv6 to hand out addresses (the M flag in your router
    // advertisements) or just options like DNS (the O flag). Router
    // advertisements come from your router, not from Kea.
    "subnet6": [

      // {
      //   "id": 1,
      //   "subnet": "2001:db8:1::/64",
      //   "pools": [ { "pool": "2001:db8:1::100 - 2001:db8:1::1ff" } ],
      //
      //   // Prefix delegation: hands whole /64s to routers further down
      //   // your network. Leave this block out if you don't need it.
      //   "pd-pools": [
      //     {
      //       "prefix": "2001:db8:2::",
      //       "prefix-len": 48,
      //       "delegated-len": 64
      //     }
      //   ],
      //
      //   "option-data": [
      //     { "name": "dns-servers",   "data": "2001:db8:1::1" },
      //     { "name": "domain-search", "data": "lan.example" }
      //   ],
      //
      //   // DHCPv6 identifies clients by DUID rather than MAC address. A DUID
      //   // can change when a device's OS is reinstalled, so v6 reservations
      //   // are a little more fragile than v4 ones. hw-address works too, if
      //   // your clients send it.
      //   "reservations": [
      //     {
      //       "duid": "01:02:03:04:05:06:07:08",
      //       "ip-addresses": [ "2001:db8:1::10" ],
      //       "hostname": "nas"
      //     }
      //   ]
      // }

    ],

    // "dhcp-ddns": {
    //   "enable-updates": true,
    //   "server-ip": "172.20.0.5",
    //   "server-port": 53001
    // },
    // "ddns-send-updates": true,
    // "ddns-qualifying-suffix": "lan.example",

    // Hooks are in /usr/lib/kea/hooks/. lease_cmds and ha are the most common.
    // "hooks-libraries": [
    //   { "library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so" }
    // ],

    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [
          { "output": "stdout", "pattern": "%-5p [%c] %m\n" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
