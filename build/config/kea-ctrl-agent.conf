// =============================================================================
// kea-ctrl-agent configuration template  (Kea 3.0 only)
// =============================================================================
//
// The control agent proxies the REST API to the DHCP daemons over their unix
// control sockets. It exists only in Kea 3.0 - it was REMOVED in 3.2, once the
// daemons gained native HTTP/TLS control sockets of their own. If you are on
// 3.2, configure "control-sockets" with socket-type "http" directly in
// kea-dhcp4.conf instead; there is no agent to run.
//
// Kea logs CTRL_AGENT_IS_DEPRECATED on startup: the agent's function has moved
// into the daemons themselves, which is why it does not exist in 3.2 at all.
// Prefer the daemons' own HTTP control sockets unless you specifically need
// the proxy behaviour on 3.0.
//
// SAFE AS-IS: binds to loopback only, so it starts and answers its own
// commands but reaches no daemon until you share /run/kea with them.
//
//     docker run --rm ghcr.io/dapalab/kea-ctrl-agent:3.0 \
//       cat /etc/kea/kea-ctrl-agent.conf > kea-ctrl-agent.conf
//
// -----------------------------------------------------------------------------
// IMPORTANT: this daemon must SHARE the socket directory with the daemons it
// proxies. In practice that means a shared volume mounted at /run/kea in every
// container, and all of them on the same network namespace or host.
//
//     docker volume create kea-sockets
//     docker run -v kea-sockets:/run/kea ...   # on kea-dhcp4 AND kea-ctrl-agent
// -----------------------------------------------------------------------------
{
  "Control-agent": {

    // Loopback by default. ISC's image binds 0.0.0.0:8000 with a password file
    // baked into the image containing api-user-name:api-user-password. Do not
    // expose this without authentication - anyone who reaches it can
    // reconfigure your DHCP server.
    "http-host": "127.0.0.1",
    "http-port": 8000,

    // Basic auth. Generate the password file OUTSIDE the image, one
    // "user:password" per line, and mount it read-only:
    //
    //   printf 'admin:%s\n' "$(openssl rand -base64 24)" > ca-password
    //   chmod 600 ca-password && sudo chown 10000:10000 ca-password
    //   docker run -v ./ca-password:/etc/kea/ca-password:ro ...
    //
    // "authentication": {
    //   "type": "basic",
    //   "directory": "/etc/kea",
    //   "clients": [ { "password-file": "ca-password" } ]
    // },

    // TLS. Mount the certificate and key; do not bake them into an image.
    //
    // "trust-anchor": "/etc/kea/tls/ca.pem",
    // "cert-file":    "/etc/kea/tls/server.pem",
    // "key-file":     "/etc/kea/tls/server-key.pem",
    // "cert-required": true,

    // Which daemons to proxy. Each socket-name must match the control socket
    // configured in that daemon, reachable through the shared volume.
    //
    // NOTE: this block cannot be empty. Kea's control agent requires at least
    // one entry and fails to start with "syntax error, unexpected }" if given
    // "control-sockets": {}. dhcp4 is therefore defined by default; until you
    // mount a shared /run/kea the socket simply will not be there, and
    // dhcp4 commands fail while the agent itself runs normally.
    "control-sockets": {
      "dhcp4": {
        "socket-type": "unix",
        "socket-name": "/run/kea/control_socket_4"
      }
      // ,"dhcp6": { "socket-type": "unix", "socket-name": "/run/kea/control_socket_6" }
      // ,"d2":   { "socket-type": "unix", "socket-name": "/run/kea/control_socket_d2" }
    },

    "loggers": [
      {
        "name": "kea-ctrl-agent",
        "output_options": [ { "output": "stdout", "pattern": "%-5p [%c] %m\n" } ],
        "severity": "INFO"
      }
    ]
  }
}
