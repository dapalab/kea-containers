// =============================================================================
// kea-ctrl-agent configuration template  (Kea 3.0 only)
// =============================================================================
//
// The control agent passes REST API requests on to the DHCP servers through
// their Unix control sockets. It's only in Kea 3.0: 3.2 removed it, because
// the servers now have HTTP/TLS control sockets of their own. On 3.2, add a
// control socket with socket-type "http" to kea-dhcp4.conf instead; there's
// no agent to run.
//
// For the same reason, Kea logs CTRL_AGENT_IS_DEPRECATED when the agent
// starts. Unless you particularly need it on 3.0, the servers' own HTTP
// control sockets are the better choice.
//
// Safe to run as it is: it only listens on loopback, so it starts and answers
// its own commands, but can't reach any server until you share /run/kea.
//
//     docker run --rm ghcr.io/dapalab/kea-ctrl-agent:3.0 \
//       cat /etc/kea/kea-ctrl-agent.conf > kea-ctrl-agent.conf
//
// -----------------------------------------------------------------------------
// To reach the servers, the agent needs to share their socket directory: a
// volume mounted at /run/kea in the agent and in each server's container.
//
//     docker volume create kea-sockets
//     docker run -v kea-sockets:/run/kea ...   # on kea-dhcp4 AND kea-ctrl-agent
// -----------------------------------------------------------------------------
{
  "Control-agent": {

    // Loopback only, by default. (ISC's image listens on 0.0.0.0:8000 with a
    // built-in password file containing api-user-name:api-user-password.)
    // Turn on authentication before opening this up: anyone who can reach it
    // can reconfigure your DHCP server.
    "http-host": "127.0.0.1",
    "http-port": 8000,

    // Basic authentication. Create the password file on the host, one
    // "user:password" per line, and mount it read-only:
    //
    //   printf 'admin:%s\n' "$(openssl rand -base64 24)" > ca-password
    //   chmod 600 ca-password && sudo chown 10000:10000 ca-password
    //   docker run -v ./ca-password:/etc/kea/ca-password:ro ...
    //
    // "authentication": {
    //   "type": "basic",
    //   "directory": "/etc/kea",
    //   "clients": [ { "password-file": "ca-password" } ]
    // },

    // TLS. Mount the certificate and key into the container, rather than
    // building them into an image.
    //
    // "trust-anchor": "/etc/kea/tls/ca.pem",
    // "cert-file":    "/etc/kea/tls/server.pem",
    // "key-file":     "/etc/kea/tls/server-key.pem",
    // "cert-required": true,

    // Which servers to pass requests on to. Each socket-name should match
    // that server's control socket, reached through the shared volume.
    //
    // This block can't be empty: with "control-sockets": {} the agent won't
    // start ("syntax error, unexpected }"). So dhcp4 is listed by default.
    // Until you share /run/kea, that socket won't exist, and dhcp4 commands
    // will fail while the agent itself runs normally.
    "control-sockets": {
      "dhcp4": {
        "socket-type": "unix",
        "socket-name": "/run/kea/control_socket_4"
      }
      // ,"dhcp6": { "socket-type": "unix", "socket-name": "/run/kea/control_socket_6" }
      // ,"d2":   { "socket-type": "unix", "socket-name": "/run/kea/control_socket_d2" }
    },

    "loggers": [
      {
        "name": "kea-ctrl-agent",
        "output_options": [ { "output": "stdout", "pattern": "%-5p [%c] %m\n" } ],
        "severity": "INFO"
      }
    ]
  }
}
