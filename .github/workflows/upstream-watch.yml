# SPDX-License-Identifier: MPL-2.0
#
# Watch which Kea branches ISC supports, and the stored PGP keyblock, and
# open an issue when either changes.
#
# Renovate tracks version numbers but knows nothing about ISC's support
# policy: it can't tell us when a new stable branch appears or an old one
# reaches end of life. This fills that gap.
#
# It opens an issue both when the branches change and when the check itself
# breaks. Otherwise a scraper that stopped matching would go quiet, and quiet
# would look like "nothing changed". This way, silence always means the check
# ran and found nothing.
name: upstream-watch

on:
  schedule:
    # Thursdays, away from the Monday rebuild, so the two are easy to tell
    # apart in the Actions list.
    - cron: '42 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check ISC's supported branch set
        id: check
        run: |
          set +e
          ./scripts/check-upstream.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "No change." ;;
            1) echo "::warning::upstream watcher could not parse ISC's download index" ;;
            2) echo "::notice::ISC's supported branch set has changed" ;;
            3) echo "::warning::the vendored ISC keyblock needs attention" ;;
            *) echo "::error::unexpected exit code $code"; exit 1 ;;
          esac

      # Don't open a second issue if one is already open. Otherwise the
      # weekly schedule would file a duplicate every Thursday until someone
      # dealt with it.
      - name: Open or update the tracking issue
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.check.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$CODE" in
            1) title="Upstream watcher is broken"
               labels="upstream-watch,bug" ;;
            3) title="Vendored ISC keyblock needs attention"
               labels="upstream-watch,security" ;;
            *) title="ISC supported Kea branches have changed"
               labels="upstream-watch" ;;
          esac

          # Make sure the labels exist (harmless if they already do).
          gh label create upstream-watch --color 0E8A16 \
            --description "Raised by the upstream support-set watcher" 2>/dev/null || true
          gh label create bug --color D73A4A 2>/dev/null || true
          gh label create security --color B60205 \
            --description "Supply-chain or signing-key issue" 2>/dev/null || true

          existing="$(gh issue list --state open --label upstream-watch \
                       --search "$title in:title" --json number --jq '.[0].number // empty')"

          printf '\n---\n\n[Watcher run](%s)\n' "$RUN_URL" >> upstream-report.md

          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open; adding a comment instead."
            gh issue comment "$existing" --body-file upstream-report.md
          else
            gh issue create --title "$title" --label "$labels" --body-file upstream-report.md
          fi
