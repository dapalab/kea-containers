# SPDX-License-Identifier: MPL-2.0
#
# Build, test and publish the Kea images.
#
# How it fits together:
#
#   matrix  reads versions.json and makes one job per (branch, arch), not per
#           (branch, image, arch). Every image in a branch comes out of one
#           builder stage, so a job per image would recompile Kea each time.
#
#   build   runs natively on each architecture, without QEMU: Kea is a large
#           C++ codebase, and an emulated aarch64 compile would be slow enough
#           to risk the job timeout. Tests run before anything is pushed, and
#           images are pushed by digest only, with no tags yet.
#
#           Testing and pushing are two separate buildx runs, so "tested
#           before pushing" doesn't automatically mean "pushed what we
#           tested". So the push step checks that the image it published is
#           the one the tests ran against, and fails if not (D21).
#
#   fuse    combines the per-arch digests into one multi-arch image each and
#           applies the tags. Nothing is reachable by tag until this runs, so
#           a run that stops half-way can't leave a tag half-updated. Every
#           image is checked before any is tagged, so a failed check can't
#           leave the images on different builds either (though a registry
#           error part-way through tagging still could; see D27).
name: build

on:
  push:
    branches: [main]
    # Documentation-only changes can't affect an image, and a full rebuild
    # takes about 25 minutes across four jobs. Everything that can affect an
    # image (build/, versions.json, scripts/, test/, this workflow) is left
    # out of this list on purpose.
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '*.md'
      - 'NOTICE'
      - 'LICENSE'
      - 'renovate.json5'
      # These workflows can't affect an image. build.yml isn't listed, on
      # purpose: a change to it should rebuild.
      - '.github/workflows/renovate.yml'
      - '.github/workflows/upstream-watch.yml'
      - '.github/workflows/scan.yml'
      - '.github/workflows/build-skip.yml'
  pull_request:
    # The same filter as the push trigger, so a documentation PR doesn't run
    # the whole build. build-skip.yml has the exact opposite filter and
    # provides the 'required' check that branch protection needs, so
    # skipping here never leaves a PR stuck.
    # scripts/check-workflow-paths.py checks that the two lists stay in sync.
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '*.md'
      - 'NOTICE'
      - 'LICENSE'
      - 'renovate.json5'
      - '.github/workflows/renovate.yml'
      - '.github/workflows/upstream-watch.yml'
      - '.github/workflows/scan.yml'
      - '.github/workflows/build-skip.yml'
  schedule:
    # A weekly rebuild, so Alpine security fixes arrive between Kea releases.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gc-packages.py is run by hand, so nothing else in CI would notice if
      # it stopped compiling. This is a cheap check.
      - name: Byte-compile helper scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate versions.json
        run: ./scripts/matrix.py check

      # DL3018 (pin apk versions) is ignored on purpose. Pinning package
      # versions would stop the weekly rebuild picking up Alpine security
      # fixes, which is its whole point. The base image is pinned by digest
      # instead, and that's what keeps builds reproducible.
      - name: hadolint
        run: |
          docker run --rm -i hadolint/hadolint:latest-alpine \
            hadolint --ignore DL3018 - < build/Dockerfile

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            test/smoke.sh test/verify-signature-test.sh \
            build/verify-tarball.sh build/make-sbom.sh test/make-sbom-test.sh \
            test/scan-report-test.sh

      # The source signature check, run against expired, revoked, untrusted
      # and tampered fixtures to make sure it rejects each one. It only needs
      # gpg, so it runs here rather than after a 25-minute Kea compile.
      - name: Signature gate negative controls
        run: ./test/verify-signature-test.sh

      # The SBOM document generator. buildx's scanner silently skips a
      # malformed document, which would drop Kea from the published SBOM
      # while the build stayed green.
      - name: SBOM document generator tests
        run: ./test/make-sbom-test.sh

      # The scan reporter. Its most important job is telling "ran and found
      # nothing" apart from "failed and produced nothing". If those ever looked
      # the same, a broken scan would go quiet, and quiet looks like good news.
      - name: Scan reporter tests
        run: ./test/scan-report-test.sh

      # The package collector deletes published images and is run by hand,
      # so it needs testing before its next real run, not by it. The tests
      # fake the registry and gh: no network, no token.
      - name: Package collector tests
        run: ./test/gc-packages-test.py

      - name: Validate shipped config templates
        run: ./scripts/validate-configs.py

      # If build.yml's path filters and build-skip.yml's drift apart, nothing
      # fails. Instead, pull requests get stuck, because neither workflow runs
      # and the 'required' check never reports. This catches it early.
      - name: Check workflow path filters are in sync
        run: ./scripts/check-workflow-paths.py

  # ---------------------------------------------------------------------------
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      created: ${{ steps.stamp.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gen
        run: echo "matrix=$(./scripts/matrix.py matrix)" >> "$GITHUB_OUTPUT"

      # One timestamp for the whole run, made here because this job runs
      # before all the others. It's used for two things:
      #
      #   1. the org.opencontainers.image.created label, which is then the same
      #      in the test build and the push build (D21), and the same for amd64
      #      and arm64 (it wasn't when each build job made its own).
      #   2. the stamped tag fuse applies (D10), so the tag and the label
      #      always agree.
      #
      # So a run that crosses midnight UTC uses one date throughout, rather
      # than amd64 getting one day and the tag the next.
      #
      # Keep it as an output of this job. fuse's "immutable tag already exists"
      # error suggests 'Re-run all jobs', and that advice only works because
      # re-running all jobs re-runs this one (a fresh stamp), while 'Re-run
      # failed jobs' reuses its outputs (the same stamp, so the tag collides).
      # Moving the stamp closer to where it's used looks like a tidy-up, but
      # would quietly make that advice wrong.
      - id: stamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  build:
    needs: [lint, matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build every image for this branch locally first. The builder stage
      # compiles Kea once and each image comes out of that same cache, which
      # is why this is one job rather than one per image.
      - name: Build images for testing
        env:
          IMAGES: ${{ matrix.images }}
          KEA: ${{ matrix.kea }}
          ALPINE_REF: ${{ matrix.alpineRef }}
          BRANCH: ${{ matrix.branch }}
          ARCH: ${{ matrix.arch }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          # One stamp for the whole run - see the matrix job.
          CREATED: ${{ needs.matrix.outputs.created }}
        run: |
          set -euo pipefail
          test -n "$CREATED"
          mkdir -p /tmp/tested
          for img in $IMAGES; do
            echo "::group::build kea-$img (test)"
            docker buildx build \
              --target "$img" \
              --build-arg "KEA_VERSION=$KEA" \
              --build-arg "ALPINE_REF=$ALPINE_REF" \
              --build-arg "SOURCE_URL=$SOURCE_URL" \
              --build-arg "REVISION=$REVISION" \
              --build-arg "CREATED=$CREATED" \
              --cache-from "type=gha,scope=${BRANCH}-${ARCH}" \
              --cache-to   "type=gha,scope=${BRANCH}-${ARCH},mode=max" \
              --metadata-file "/tmp/meta-test-${img}.json" \
              --load -t "kea-$img:test" \
              -f build/Dockerfile build/
            # For a --load build, this is the image manifest digest, which is
            # what the push step's index will contain. Saved so the push can
            # check it published these exact bytes.
            tested="$(jq -r '."containerimage.digest"' "/tmp/meta-test-${img}.json")"
            test -n "$tested" && test "$tested" != "null"
            echo "$tested" > "/tmp/tested/${img}"
            echo "kea-${img} tested image manifest -> ${tested}"
            echo "::endgroup::"
          done

      - name: Verify provenance of the build
        run: |
          set -euo pipefail
          echo "Kea version reported by the binary:"
          docker run --rm kea-dhcp4:test /usr/sbin/kea-dhcp4 -V
          echo "Architecture:"
          docker run --rm kea-dhcp4:test uname -m

      - name: Functional smoke test
        env:
          DHCP4_IMAGE: kea-dhcp4:test
          TOOLS_IMAGE: kea-tools:test
          EXPECT_VERSION: ${{ matrix.kea }}
        run: ./test/smoke.sh

      # Only now, with the tests passed, push: by digest, with no tag. The
      # fuse job adds tags once both architectures have succeeded.
      - name: Push by digest
        if: github.event_name != 'pull_request'
        env:
          IMAGES: ${{ matrix.images }}
          KEA: ${{ matrix.kea }}
          ALPINE_REF: ${{ matrix.alpineRef }}
          BRANCH: ${{ matrix.branch }}
          ARCH: ${{ matrix.arch }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          CREATED: ${{ needs.matrix.outputs.created }}
        run: |
          set -euo pipefail
          test -n "$CREATED"
          mkdir -p /tmp/digests
          for img in $IMAGES; do
            echo "::group::push kea-$img@digest"
            docker buildx build \
              --target "$img" \
              --build-arg "KEA_VERSION=$KEA" \
              --build-arg "ALPINE_REF=$ALPINE_REF" \
              --build-arg "SOURCE_URL=$SOURCE_URL" \
              --build-arg "REVISION=$REVISION" \
              --build-arg "CREATED=$CREATED" \
              --cache-from "type=gha,scope=${BRANCH}-${ARCH}" \
              --provenance=true --sbom=true \
              --metadata-file /tmp/meta.json \
              --output "type=image,name=${REGISTRY}/${OWNER}/kea-${img},push-by-digest=true,name-canonical=true,push=true" \
              -f build/Dockerfile build/
            digest="$(jq -r '."containerimage.digest"' /tmp/meta.json)"
            test -n "$digest" && test "$digest" != "null"
            echo "$digest" > "/tmp/digests/${img}"
            echo "kea-${img} ${ARCH} -> ${digest}"

            # Check we published the bytes we tested.
            #
            # These two digests aren't the same kind of thing, which is easy
            # to miss. A registry push wraps the image in an index, alongside
            # the provenance and SBOM attestations (platform "unknown/unknown"),
            # so $digest above is an index digest and never equals the --load
            # build's digest. Tested against a local registry: the index digest
            # changes with and without attestations, while the image inside it
            # matches the tested one either way.
            #
            # So compare like with like: the image inside the index.
            raw="$(docker buildx imagetools inspect --raw \
                     "${REGISTRY}/${OWNER}/kea-${img}@${digest}")"
            if echo "$raw" | jq -e 'has("manifests")' >/dev/null; then
              published="$(echo "$raw" | jq -r '[.manifests[]
                             | select(.platform.os != "unknown") | .digest]
                             | unique | join(" ")')"
            else
              published="$digest"
            fi
            tested="$(cat "/tmp/tested/${img}")"
            if [ "$published" != "$tested" ]; then
              echo "::error::kea-${img} ${ARCH}: published image is not the tested image"
              echo "  tested    : ${tested}"
              echo "  published : ${published}"
              echo "  index     : ${digest}"
              echo "The gates ran against different bytes than were pushed."
              echo "Most likely the build cache missed and Kea was recompiled."
              exit 1
            fi
            echo "  verified: published image manifest == tested (${tested})"
            echo "::endgroup::"
          done

      - name: Upload digests
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.branch }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # One check with a name that never changes, for branch protection to
  # require.
  #
  # The build jobs are a matrix, so their names include the Kea version and
  # the Alpine digest: "build (3.2, 3.2.0, alpine:3.24@sha256:294b68...)".
  # Those names change whenever versions.json does, which is exactly what
  # Renovate changes. Requiring them directly would leave branch protection
  # waiting forever for a check under its old name, blocking the very
  # updates the automation is there to deliver.
  #
  # Requiring only this job avoids that. Its name stays the same, and it fails
  # if any job it depends on failed, was cancelled or was skipped (D20).
  required:
    name: required
    needs: [lint, matrix, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Assert every prerequisite job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          bad="$(printf '%s' "$RESULTS" \
                 | jq -r 'to_entries[] | select(.value.result != "success")
                          | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then
            echo "::error::prerequisite job(s) did not succeed: $bad"
            exit 1
          fi
          echo "All prerequisite jobs succeeded."

  # ---------------------------------------------------------------------------
  fuse:
    needs: [matrix, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Needed for keyless cosign signing: each signature is tied to this
      # workflow's OIDC identity, so there's no key to store or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*

      - name: Create manifest lists and apply tags
        env:
          OWNER: ${{ github.repository_owner }}
          CREATED: ${{ needs.matrix.outputs.created }}
        run: |
          set -euo pipefail
          # The stamped tag comes from the same timestamp as the images'
          # created label, so 3.2.0-20260920-2244 always names a build
          # labelled 2026-09-20T22:44Z. Taking a fresh `date` here could let
          # the two disagree on a run that crosses midnight UTC.
          #
          # To the minute, not just the day: images rebuild whenever a
          # Renovate update merges as well as weekly, and four builds ran on
          # 2026-09-20 alone. See docs/DECISIONS.md D10.
          test -n "$CREATED"
          STAMP="$(printf '%s' "$CREATED" \
                    | sed -E 's/^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}).*$/\1\2\3-\4\5/')"
          case "$STAMP" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]) ;;
            *) echo "::error::bad stamp derived from CREATED=$CREATED"; exit 1 ;;
          esac
          echo "immutable tag stamp: $STAMP"

          # Two passes, so the set of images is updated together, like each
          # image is. Pass 1 checks every (branch, image) and writes a plan,
          # without tagging anything. Pass 2 applies the plan. Before this, a
          # missing digest or a clashing stamped tag on image 5 showed up after
          # images 1-4 were already retagged, leaving kea-dhcp4:3.0 on a
          # different build from kea-dhcp6:3.0, with no visible error.
          #
          # This narrows the window rather than closing it: a registry error
          # during pass 2 can still stop part-way, because the registry can't
          # update several tags as one transaction. See D27.
          plan=/tmp/fuse-plan
          rm -rf "$plan"; mkdir -p "$plan"
          for branch in $(python3 -c "import json;print(' '.join(json.load(open('versions.json'))['branches']))"); do
            for img in $(./scripts/matrix.py images "$branch"); do
              refs=()
              for arch in amd64 arm64; do
                f="/tmp/digests/digests-${branch}-${arch}/${img}"
                if [ ! -f "$f" ]; then
                  echo "::error::missing digest for kea-${img} ${branch}/${arch} - nothing tagged"
                  exit 1
                fi
                refs+=("${REGISTRY}/${OWNER}/kea-${img}@$(cat "$f")")
              done

              mapfile -t tags < <(./scripts/matrix.py tags "$branch" "$img" \
                                    --stamp "$STAMP" \
                                    --registry "$REGISTRY" --owner "$OWNER")

              # The stamped tag mustn't already exist. Runs on main are
              # queued one at a time and a build takes 17+ minutes, so two
              # runs shouldn't be able to tag in the same minute. But
              # overwriting a tag we promise never to reuse would be worse
              # than failing the publish, so we check rather than assume.
              immutable=""
              for t in "${tags[@]}"; do
                case "$t" in *-"$STAMP") immutable="$t" ;; esac
              done
              if [ -z "$immutable" ]; then
                echo "::error::no immutable tag in the list for kea-${img} - nothing tagged"
                exit 1
              fi
              if docker buildx imagetools inspect "$immutable" >/dev/null 2>&1; then
                echo "::error::immutable tag already exists: ${immutable} - nothing tagged"
                echo "It is documented as never reused, so this run will not"
                echo "overwrite it. If you re-ran only the failed jobs, the"
                echo "stamp was carried over from the original attempt - use"
                echo "'Re-run all jobs' instead, which stamps a fresh time."
                exit 1
              fi

              printf '%s\n' "${tags[@]}" > "$plan/${branch}-${img}.tags"
              printf '%s\n' "${refs[@]}" > "$plan/${branch}-${img}.refs"
              echo "${img}" >> "$plan/${branch}.images"
            done
          done
          echo "pre-flight passed for $(cat "$plan"/*.images | wc -l) images"

          for branch in $(python3 -c "import json;print(' '.join(json.load(open('versions.json'))['branches']))"); do
            while read -r img; do
              mapfile -t tags < "$plan/${branch}-${img}.tags"
              mapfile -t refs < "$plan/${branch}-${img}.refs"
              targs=()
              for t in "${tags[@]}"; do targs+=(--tag "$t"); done

              echo "::group::kea-${img} (${branch})"
              printf '  tag: %s\n' "${tags[@]}"
              printf '  arch: %s\n' "${refs[@]}"

              docker buildx imagetools create "${targs[@]}" "${refs[@]}"

              # Record the index digest. One signature on the index covers
              # every tag pointing at it (3.2.0-20260920-2244, 3.2.0 and 3.2
              # share one), and it stays valid when a moving tag later points
              # somewhere else, because it belongs to the bytes. That's why the
              # stamped tag matters: after next week's rebuild, the signature
              # is still reachable through it, while 3.2.0 has moved on.
              idx="$(docker buildx imagetools inspect "${tags[0]}" \
                       --format '{{.Manifest.Digest}}')"
              echo "${REGISTRY}/${OWNER}/kea-${img}@${idx}" >> /tmp/sign-refs.txt
              echo "  index: ${idx}"
              echo "::endgroup::"
            done < "$plan/${branch}.images"
          done

      - name: Verify published manifests are genuinely multi-arch
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          fail=0
          for branch in $(python3 -c "import json;print(' '.join(json.load(open('versions.json'))['branches']))"); do
            for img in $(./scripts/matrix.py images "$branch"); do
              ref="${REGISTRY}/${OWNER}/kea-${img}:${branch}"
              got="$(docker buildx imagetools inspect --raw "$ref" \
                     | jq -r '[.manifests[].platform | select(.os=="linux") |
                              "\(.architecture)"] | sort | unique | join(",")')"
              if [ "$got" = "amd64,arm64" ]; then
                echo "  ok    $ref -> $got"
              else
                echo "::error::$ref resolved to [$got], expected amd64,arm64"
                fail=1
              fi
            done
          done
          exit "$fail"

      # The SPDX document in each image is checked before publishing (smoke
      # gate 2), but that only shows the input is there, not that buildx
      # merged it into the SBOM it published. This checks what people actually
      # get: the SBOM on the tag they pull lists Kea, at the right version.
      #
      # Before this, the published SBOM for kea-dhcp4:3.2 listed 25 apk
      # packages and didn't mention Kea at all (D23).
      - name: Verify the published SBOM names Kea
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          fail=0
          for branch in $(python3 -c "import json;print(' '.join(json.load(open('versions.json'))['branches']))"); do
            kea="$(python3 -c "import json,sys;print(json.load(open('versions.json'))['branches'][sys.argv[1]]['kea'])" "$branch")"
            for img in $(./scripts/matrix.py images "$branch"); do
              ref="${REGISTRY}/${OWNER}/kea-${img}:${branch}"
              got="$(docker buildx imagetools inspect "$ref" --format '{{ json .SBOM }}' \
                     | jq -r --arg v "$kea" '
                         [.. | objects | select(.name? == "kea") | .versionInfo]
                         | unique | join(",")')"
              if [ "$got" = "$kea" ]; then
                echo "  ok    $ref -> SBOM names kea $got"
              else
                echo "::error::$ref SBOM has kea version [$got], expected [$kea]"
                fail=1
              fi
            done
          done
          exit "$fail"

      # Signing comes last, after the images are confirmed multi-arch. A
      # signature says "this repository's CI produced these bytes", so it
      # shouldn't go on an image we haven't yet confirmed was put together
      # correctly.
      - name: Sign published images (keyless)
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          test -s /tmp/sign-refs.txt || { echo "::error::no refs to sign"; exit 1; }

          # Sign the index and the two platform images inside it, so a
          # digest pinned to one architecture verifies too. Not the
          # attestations, which nobody pulls, so not --recursive, which would
          # sign them as well. On GHCR each signature is two package versions
          # (there's no Referrers API, so cosign adds a tagged index beside
          # the bundle): --recursive meant 10 per index, this is 6. See D25.
          : > /tmp/sign-subjects.txt
          while read -r ref; do
            [ -n "$ref" ] || continue
            repo="${ref%@*}"
            mapfile -t platforms < <(docker buildx imagetools inspect --raw "$ref" \
              | jq -r '.manifests[] | select(.platform.os != "unknown") | .digest')
            # Already checked for amd64+arm64 above. Check again here, because
            # a wrong count would quietly sign too little or too much.
            if [ "${#platforms[@]}" -ne 2 ]; then
              echo "::error::${ref} has ${#platforms[@]} platform images, expected 2"
              exit 1
            fi
            printf '%s\n' "$ref" "${platforms[@]/#/${repo}@}" >> /tmp/sign-subjects.txt
          done < /tmp/sign-refs.txt

          while read -r subject; do
            echo "::group::sign $subject"
            cosign sign "$subject"
            echo "::endgroup::"
          done < /tmp/sign-subjects.txt

          # Not `cosign verify ... && echo ok`: a failure on the left of && is
          # exempt from set -e, so every image but the last could fail to
          # verify and the step would still pass. That's how it was until D25.
          echo "::group::verify what we just signed"
          fail=0
          while read -r subject; do
            if cosign verify "$subject" \
                 --certificate-identity-regexp \
                   "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/build\.yml@" \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                 > /dev/null; then
              echo "  ok    $subject"
            else
              echo "::error::signature does not verify: $subject"
              fail=1
            fi
          done < /tmp/sign-subjects.txt
          echo "::endgroup::"
          exit "$fail"
