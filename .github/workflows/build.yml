# SPDX-License-Identifier: MPL-2.0
#
# Build, test and publish the Kea images.
#
# Shape of this workflow, and why:
#
#   matrix  reads versions.json and emits one job per (branch, arch). NOT per
#           (branch, image, arch) - every image in a branch comes out of one
#           builder stage, so fanning out per image would recompile Kea for
#           each one.
#
#   build   runs natively on the target architecture. No QEMU: Kea is a large
#           C++ codebase and an emulated aarch64 compile is slow enough to risk
#           the job timeout. Tests run BEFORE anything is pushed, and images are
#           pushed by digest only - no tags yet.
#
#           Testing and pushing are two separate buildx invocations, so "we
#           tested it before we pushed it" does not by itself mean "we pushed
#           what we tested". The push step therefore ASSERTS that the image
#           manifest it published is the one the gates ran against, and fails
#           if it is not.
#
#   fuse    joins the per-arch digests into one manifest list per image and
#           applies the tags. Until this runs, nothing is reachable by tag, so
#           a half-finished run never leaves a partially updated tag behind.
name: build

on:
  push:
    branches: [main]
    # Documentation-only changes cannot alter an image, and a full rebuild is
    # ~25 minutes across four jobs. Everything that CAN affect an image -
    # build/, versions.json, scripts/, test/, the workflows themselves - is
    # deliberately absent from this list.
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '*.md'
      - 'NOTICE'
      - 'LICENSE'
      - 'renovate.json5'
      # These two workflows cannot affect an image. build.yml is deliberately
      # NOT listed - a change to it must rebuild.
      - '.github/workflows/renovate.yml'
      - '.github/workflows/upstream-watch.yml'
      - '.github/workflows/scan.yml'
      - '.github/workflows/build-skip.yml'
  pull_request:
    # Same filter as the push trigger, so a documentation PR does not
    # run the four-job matrix for nothing. build-skip.yml carries the
    # exact inverse filter and supplies the 'required' check branch
    # protection needs, so skipping here cannot strand a PR.
    # scripts/check-workflow-paths.py asserts the lists stay in sync.
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '*.md'
      - 'NOTICE'
      - 'LICENSE'
      - 'renovate.json5'
      - '.github/workflows/renovate.yml'
      - '.github/workflows/upstream-watch.yml'
      - '.github/workflows/scan.yml'
      - '.github/workflows/build-skip.yml'
  schedule:
    # Weekly rebuild so Alpine security fixes land without a Kea release.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gc-packages.py is a manual tool, so nothing else in CI would notice
      # it rotting. A compile check is cheap insurance.
      - name: Byte-compile helper scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate versions.json
        run: ./scripts/matrix.py check

      # DL3018 (pin apk versions) is ignored deliberately. Pinning package
      # versions would defeat the weekly rebuild, whose whole purpose is to
      # pick up Alpine security fixes without a Kea release. The base image is
      # digest-pinned, which is where reproducibility is anchored instead.
      - name: hadolint
        run: |
          docker run --rm -i hadolint/hadolint:latest-alpine \
            hadolint --ignore DL3018 - < build/Dockerfile

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            test/smoke.sh test/verify-signature-test.sh \
            build/verify-tarball.sh build/make-sbom.sh test/make-sbom-test.sh \
            test/scan-report-test.sh

      # The source-tarball signature gate, driven against expired, revoked,
      # untrusted and tampered fixtures. It needs only gpg, so it belongs here
      # rather than behind a 25-minute Kea compile - and a security check that
      # has never failed for the right reason is not a check.
      - name: Signature gate negative controls
        run: ./test/verify-signature-test.sh

      # The SBOM document generator. A malformed document is skipped silently
      # by buildx's scanner, which would put Kea back to being absent from
      # the published SBOM with a green build.
      - name: SBOM document generator tests
        run: ./test/make-sbom-test.sh

      # The scan reporter. Its important behaviour is telling "ran and found
      # nothing" apart from "errored and produced nothing" - if those ever
      # collapse into the same exit code, the scan goes quiet and that reads
      # as good news.
      - name: Scan reporter tests
        run: ./test/scan-report-test.sh

      - name: Validate shipped config templates
        run: ./scripts/validate-configs.py

      # Drift between build.yml's path filters and build-skip.yml's does not
      # fail a build - it strands pull requests, because neither workflow
      # triggers and the 'required' check never reports. Catch it here instead.
      - name: Check workflow path filters are in sync
        run: ./scripts/check-workflow-paths.py

  # ---------------------------------------------------------------------------
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      created: ${{ steps.stamp.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gen
        run: echo "matrix=$(./scripts/matrix.py matrix)" >> "$GITHUB_OUTPUT"

      # ONE timestamp for the whole run, stamped here because this job runs
      # before every other. It does two jobs:
      #
      #   1. org.opencontainers.image.created, identical in the test build and
      #      the push build (D21) AND identical across amd64 and arm64, which
      #      it was not when each build job stamped its own.
      #   2. the immutable date-suffixed tag applied in fuse (D10), so the tag
      #      and the label agree by construction rather than by coincidence.
      #
      # A run that crosses midnight UTC therefore gets one date throughout,
      # rather than amd64 landing on one day and the tag on the next.
      - id: stamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  build:
    needs: [lint, matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build every image for this branch locally first. The builder stage
      # compiles Kea once; the per-image targets come out of that same cache,
      # which is why this is one job rather than one per image.
      - name: Build images for testing
        env:
          IMAGES: ${{ matrix.images }}
          KEA: ${{ matrix.kea }}
          ALPINE_REF: ${{ matrix.alpineRef }}
          BRANCH: ${{ matrix.branch }}
          ARCH: ${{ matrix.arch }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          # One stamp for the whole run - see the matrix job.
          CREATED: ${{ needs.matrix.outputs.created }}
        run: |
          set -euo pipefail
          test -n "$CREATED"
          mkdir -p /tmp/tested
          for img in $IMAGES; do
            echo "::group::build kea-$img (test)"
            docker buildx build \
              --target "$img" \
              --build-arg "KEA_VERSION=$KEA" \
              --build-arg "ALPINE_REF=$ALPINE_REF" \
              --build-arg "SOURCE_URL=$SOURCE_URL" \
              --build-arg "REVISION=$REVISION" \
              --build-arg "CREATED=$CREATED" \
              --cache-from "type=gha,scope=${BRANCH}-${ARCH}" \
              --cache-to   "type=gha,scope=${BRANCH}-${ARCH},mode=max" \
              --metadata-file "/tmp/meta-test-${img}.json" \
              --load -t "kea-$img:test" \
              -f build/Dockerfile build/
            # For a --load build this is the OCI IMAGE MANIFEST digest, which
            # is what the push step's index wraps. Recorded so the push can
            # prove it published these exact bytes.
            tested="$(jq -r '."containerimage.digest"' "/tmp/meta-test-${img}.json")"
            test -n "$tested" && test "$tested" != "null"
            echo "$tested" > "/tmp/tested/${img}"
            echo "kea-${img} tested image manifest -> ${tested}"
            echo "::endgroup::"
          done

      - name: Verify provenance of the build
        run: |
          set -euo pipefail
          echo "Kea version reported by the binary:"
          docker run --rm kea-dhcp4:test /usr/sbin/kea-dhcp4 -V
          echo "Architecture:"
          docker run --rm kea-dhcp4:test uname -m

      - name: Functional smoke test
        env:
          DHCP4_IMAGE: kea-dhcp4:test
          TOOLS_IMAGE: kea-tools:test
          EXPECT_VERSION: ${{ matrix.kea }}
        run: ./test/smoke.sh

      # Only now, with tests green, push. By digest and with no tag: the
      # fuse job applies tags once BOTH architectures have succeeded.
      - name: Push by digest
        if: github.event_name != 'pull_request'
        env:
          IMAGES: ${{ matrix.images }}
          KEA: ${{ matrix.kea }}
          ALPINE_REF: ${{ matrix.alpineRef }}
          BRANCH: ${{ matrix.branch }}
          ARCH: ${{ matrix.arch }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          CREATED: ${{ needs.matrix.outputs.created }}
        run: |
          set -euo pipefail
          test -n "$CREATED"
          mkdir -p /tmp/digests
          for img in $IMAGES; do
            echo "::group::push kea-$img@digest"
            docker buildx build \
              --target "$img" \
              --build-arg "KEA_VERSION=$KEA" \
              --build-arg "ALPINE_REF=$ALPINE_REF" \
              --build-arg "SOURCE_URL=$SOURCE_URL" \
              --build-arg "REVISION=$REVISION" \
              --build-arg "CREATED=$CREATED" \
              --cache-from "type=gha,scope=${BRANCH}-${ARCH}" \
              --provenance=true --sbom=true \
              --metadata-file /tmp/meta.json \
              --output "type=image,name=${REGISTRY}/${OWNER}/kea-${img},push-by-digest=true,name-canonical=true,push=true" \
              -f build/Dockerfile build/
            digest="$(jq -r '."containerimage.digest"' /tmp/meta.json)"
            test -n "$digest" && test "$digest" != "null"
            echo "$digest" > "/tmp/digests/${img}"
            echo "kea-${img} ${ARCH} -> ${digest}"

            # Prove we published the bytes we tested.
            #
            # These two digests are NOT the same kind of thing, which is the
            # trap. A registry push wraps the image manifest in an INDEX
            # alongside the provenance/SBOM attestation manifests (which
            # carry platform "unknown/unknown"), so $digest above is an index
            # digest and can never equal the --load build's digest. Verified
            # empirically against a local registry: the index digest differs
            # with and without attestations, while the child image manifest
            # is identical to the tested one in both cases.
            #
            # So compare like with like: the index's own image manifest.
            raw="$(docker buildx imagetools inspect --raw \
                     "${REGISTRY}/${OWNER}/kea-${img}@${digest}")"
            if echo "$raw" | jq -e 'has("manifests")' >/dev/null; then
              published="$(echo "$raw" | jq -r '[.manifests[]
                             | select(.platform.os != "unknown") | .digest]
                             | unique | join(" ")')"
            else
              published="$digest"
            fi
            tested="$(cat "/tmp/tested/${img}")"
            if [ "$published" != "$tested" ]; then
              echo "::error::kea-${img} ${ARCH}: published image is not the tested image"
              echo "  tested    : ${tested}"
              echo "  published : ${published}"
              echo "  index     : ${digest}"
              echo "The gates ran against different bytes than were pushed."
              echo "Most likely the build cache missed and Kea was recompiled."
              exit 1
            fi
            echo "  verified: published image manifest == tested (${tested})"
            echo "::endgroup::"
          done

      - name: Upload digests
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.branch }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # A single, STABLY NAMED check for branch protection to require.
  #
  # The build jobs are a matrix, so their names embed the Kea version and the
  # Alpine digest: "build (3.2, 3.2.0, alpine:3.24@sha256:294b68...)". Those
  # names change whenever versions.json changes - which is exactly what
  # Renovate does. Requiring them directly would leave branch protection
  # waiting forever for a check that will never report under its old name,
  # blocking the very updates this automation exists to deliver.
  #
  # Requiring only this job avoids that. Its name never changes, and it fails
  # if any job it depends on failed, was cancelled, or was skipped.
  required:
    name: required
    needs: [lint, matrix, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Assert every prerequisite job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          bad="$(printf '%s' "$RESULTS" \
                 | jq -r 'to_entries[] | select(.value.result != "success")
                          | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then
            echo "::error::prerequisite job(s) did not succeed: $bad"
            exit 1
          fi
          echo "All prerequisite jobs succeeded."

  # ---------------------------------------------------------------------------
  fuse:
    needs: [matrix, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Required for keyless cosign signing: the workflow's OIDC identity is
      # what the signature is bound to, so there is no key to store or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*

      - name: Create manifest lists and apply tags
        env:
          OWNER: ${{ github.repository_owner }}
          CREATED: ${{ needs.matrix.outputs.created }}
        run: |
          set -euo pipefail
          # The immutable tag comes from the SAME stamp as the images'
          # created label, so 3.2.0-20260920-2203 always names a build
          # labelled 2026-09-20T22:03Z. Deriving it here with a fresh `date`
          # would let the two disagree on a run that crosses midnight UTC.
          #
          # Minute resolution, not day: images rebuild on every automerged
          # Renovate PR as well as weekly, and four builds ran on
          # 2026-09-20 alone. See docs/DECISIONS.md D10.
          test -n "$CREATED"
          STAMP="$(printf '%s' "$CREATED" \
                    | sed -E 's/^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}).*$/\1\2\3-\4\5/')"
          case "$STAMP" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]) ;;
            *) echo "::error::bad stamp derived from CREATED=$CREATED"; exit 1 ;;
          esac
          echo "immutable tag stamp: $STAMP"
          for branch in $(python3 -c "import json;print(' '.join(json.load(open('versions.json'))['branches']))"); do
            for img in $(./scripts/matrix.py images "$branch"); do
              refs=()
              for arch in amd64 arm64; do
                f="/tmp/digests/digests-${branch}-${arch}/${img}"
                if [ ! -f "$f" ]; then
                  echo "::error::missing digest for kea-${img} ${branch}/${arch}"
                  exit 1
                fi
                refs+=("${REGISTRY}/${OWNER}/kea-${img}@$(cat "$f")")
              done

              mapfile -t tags < <(./scripts/matrix.py tags "$branch" "$img" \
                                    --stamp "$STAMP" \
                                    --registry "$REGISTRY" --owner "$OWNER")
              targs=()
              for t in "${tags[@]}"; do targs+=(--tag "$t"); done

              echo "::group::kea-${img} (${branch})"
              printf '  tag: %s\n' "${tags[@]}"
              printf '  arch: %s\n' "${refs[@]}"

              # The immutable tag must not already exist. The concurrency
              # group serialises runs on main and a build takes 17+ minutes,
              # so two runs cannot tag in the same minute - but that is an
              # argument, and this repo has been bitten twice by trusting
              # one. Overwriting a tag documented as never reused is worse
              # than failing the publish, so prove it instead.
              immutable=""
              for t in "${tags[@]}"; do
                case "$t" in *-"$STAMP") immutable="$t" ;; esac
              done
              if [ -z "$immutable" ]; then
                echo "::error::no immutable tag in the list for kea-${img}"
                exit 1
              fi
              if docker buildx imagetools inspect "$immutable" >/dev/null 2>&1; then
                echo "::error::immutable tag already exists: ${immutable}"
                echo "It is documented as never reused, so this run will not"
                echo "overwrite it. If you re-ran only the failed jobs, the"
                echo "stamp was carried over from the original attempt - use"
                echo "'Re-run all jobs' instead, which stamps a fresh time."
                exit 1
              fi

              docker buildx imagetools create "${targs[@]}" "${refs[@]}"

              # Record the INDEX digest. Signing the index covers every tag
              # pointing at it, so 3.2.0-20260920-2203, 3.2.0 and 3.2 need one
              # signature between them - and the signature stays valid when a
              # moving tag is later repointed elsewhere, because it is bound
              # to the bytes. That is exactly why the date tag matters: after
              # next week's rebuild the signature still resolves through the
              # date tag, while 3.2.0 has moved on.
              idx="$(docker buildx imagetools inspect "${tags[0]}" \
                       --format '{{.Manifest.Digest}}')"
              echo "${REGISTRY}/${OWNER}/kea-${img}@${idx}" >> /tmp/sign-refs.txt
              echo "  index: ${idx}"
              echo "::endgroup::"
            done
          done

      - name: Verify published manifests are genuinely multi-arch
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          fail=0
          for branch in $(python3 -c "import json;print(' '.join(json.load(open('versions.json'))['branches']))"); do
            for img in $(./scripts/matrix.py images "$branch"); do
              ref="${REGISTRY}/${OWNER}/kea-${img}:${branch}"
              got="$(docker buildx imagetools inspect --raw "$ref" \
                     | jq -r '[.manifests[].platform | select(.os=="linux") |
                              "\(.architecture)"] | sort | unique | join(",")')"
              if [ "$got" = "amd64,arm64" ]; then
                echo "  ok    $ref -> $got"
              else
                echo "::error::$ref resolved to [$got], expected amd64,arm64"
                fail=1
              fi
            done
          done
          exit "$fail"

      # The shipped SPDX document is checked before publishing (smoke gate 2),
      # but that proves the INPUT exists - not that buildx merged it into the
      # attestation it published. This asserts the claim itself: the SBOM
      # attached to the tag a user pulls names Kea, at the right version.
      #
      # Before this existed, the published SBOM for kea-dhcp4:3.2 catalogued
      # 25 apk packages and did not contain the string "kea" at all.
      - name: Verify the published SBOM names Kea
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          fail=0
          for branch in $(python3 -c "import json;print(' '.join(json.load(open('versions.json'))['branches']))"); do
            kea="$(python3 -c "import json,sys;print(json.load(open('versions.json'))['branches'][sys.argv[1]]['kea'])" "$branch")"
            for img in $(./scripts/matrix.py images "$branch"); do
              ref="${REGISTRY}/${OWNER}/kea-${img}:${branch}"
              got="$(docker buildx imagetools inspect "$ref" --format '{{ json .SBOM }}' \
                     | jq -r --arg v "$kea" '
                         [.. | objects | select(.name? == "kea") | .versionInfo]
                         | unique | join(",")')"
              if [ "$got" = "$kea" ]; then
                echo "  ok    $ref -> SBOM names kea $got"
              else
                echo "::error::$ref SBOM has kea version [$got], expected [$kea]"
                fail=1
              fi
            done
          done
          exit "$fail"

      # Signing happens LAST, after the manifests are verified multi-arch.
      # A signature asserts "this repository's CI produced these bytes"; it
      # would be actively misleading to attach one to an image we had not
      # yet confirmed was correctly assembled.
      - name: Sign published images (keyless)
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          test -s /tmp/sign-refs.txt || { echo "::error::no refs to sign"; exit 1; }
          while read -r ref; do
            [ -n "$ref" ] || continue
            echo "::group::sign $ref"
            cosign sign --recursive "$ref"
            echo "::endgroup::"
          done < /tmp/sign-refs.txt

          echo "::group::verify what we just signed"
          while read -r ref; do
            [ -n "$ref" ] || continue
            cosign verify "$ref" \
              --certificate-identity-regexp \
                "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/build\.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > /dev/null && echo "  ok  $ref"
          done < /tmp/sign-refs.txt
          echo "::endgroup::"
