# SPDX-License-Identifier: MPL-2.0
#
# Self-hosted Renovate.
#
# Runs as a GitHub App rather than with GITHUB_TOKEN, for a practical reason
# as much as a security one: pull requests opened with GITHUB_TOKEN don't
# trigger other workflows. So a Renovate PR bumping Kea would never have
# build.yml run against it, and the update would arrive untested. An App token
# isn't GITHUB_TOKEN, so every Renovate PR gets the full multi-arch build and
# smoke tests.
#
# The App token is created for each run and expires within an hour; only the
# private key is stored. The App needs write access to Contents, Pull requests
# and Issues, and also to Workflows, because Renovate edits
# .github/workflows/*.yml to update pinned actions. That last one is easy to
# miss, and the error it gives is confusing. See D16.
name: renovate

on:
  schedule:
    # Daily, at a different time from the other scheduled jobs (the scan at
    # 02:48, the Monday rebuild at 04:17 and the Thursday upstream watcher at
    # 06:42), so they're easy to tell apart.
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Run without creating branches or PRs'
        type: boolean
        default: false
      logLevel:
        description: 'Renovate log level'
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Fail with a clear message, rather than letting Renovate fail with
      # something cryptic about authentication.
      - name: Check the App credentials are configured
        env:
          APP_ID: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$APP_ID" ]  || missing="$missing RENOVATE_APP_CLIENT_ID"
          [ -n "$APP_KEY" ] || missing="$missing RENOVATE_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "See the Renovate section of docs/DECISIONS.md for the App setup."
            exit 1
          fi
          echo "App credentials present."

      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id rather than app-id: the action has deprecated app-id,
          # and a Client ID (Iv23li...) can't be mixed up with an Installation
          # ID the way a plain numeric App ID can.
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: renovate.json5
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          # Commits are credited to the App's bot account, not to a person.
          #
          # The numeric prefix is what makes GitHub link the commit to the bot:
          # <bot-user-id>+<app-slug>[bot]@users.noreply.github.com. Without it,
          # the PR comes from the bot but its commits show an unlinked author.
          # Find the id with: gh api '/users/<app-slug>[bot]' --jq .id
          RENOVATE_GIT_AUTHOR: 'kea-containers-renovate[bot] <331638593+kea-containers-renovate[bot]@users.noreply.github.com>'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
