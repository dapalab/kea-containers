# SPDX-License-Identifier: MPL-2.0
#
# Self-hosted Renovate.
#
# Runs as a GitHub App rather than with GITHUB_TOKEN, for a practical reason
# as much as a security one: pull requests opened with GITHUB_TOKEN do not
# trigger other workflows. A Renovate PR bumping Kea would therefore never
# have build.yml run against it, which defeats the point of proposing it.
# An App token is not GITHUB_TOKEN, so that restriction does not apply and
# every Renovate PR gets the full multi-arch build and smoke test.
#
# The App token is minted per run and expires in an hour; only the private key
# is stored. The App needs Contents, Pull requests and Issues write - and also
# Workflows write, because Renovate edits .github/workflows/*.yml to bump the
# SHA-pinned actions. That last one is easy to miss and fails confusingly.
name: renovate

on:
  schedule:
    # Daily, deliberately offset from the Monday rebuild (04:17) and the
    # Thursday upstream watcher (06:42) so the three are distinguishable.
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Run without creating branches or PRs'
        type: boolean
        default: false
      logLevel:
        description: 'Renovate log level'
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Fail with a readable message rather than letting Renovate die with
      # something opaque about authentication.
      - name: Check the App credentials are configured
        env:
          APP_ID: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$APP_ID" ]  || missing="$missing RENOVATE_APP_CLIENT_ID"
          [ -n "$APP_KEY" ] || missing="$missing RENOVATE_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "See the Renovate section of docs/DECISIONS.md for the App setup."
            exit 1
          fi
          echo "App credentials present."

      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id, not app-id: the action deprecated app-id, and a Client
          # ID (Iv23li...) cannot be confused with an Installation ID the way
          # a bare numeric App ID can.
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: renovate.json5
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          # Commits are attributed to the App, not to a human account.
          RENOVATE_GIT_AUTHOR: 'dapalab-renovate <bot@users.noreply.github.com>'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
