# SPDX-License-Identifier: MPL-2.0
#
# A companion to build.yml, which prevents a deadlock that's easy to create
# and confusing to track down.
#
# build.yml uses paths-ignore, so documentation changes don't trigger a
# 25-minute rebuild. Branch protection requires a check named 'required',
# which build.yml provides.
#
# Together, those mean a pull request that only touches ignored paths never
# runs build.yml, so 'required' never reports, and branch protection blocks
# the PR forever. A person can override that; Renovate can't. And because
# renovate.yml and upstream-watch.yml are themselves ignored paths, a Renovate
# PR updating an action in one of them would wait on automerge forever.
#
# This workflow has the exact opposite path filter, and provides a passing
# 'required' check for exactly the cases build.yml skips. Keep the two filters
# in sync: if you add a path to one, add it to the other.
# (scripts/check-workflow-paths.py checks this in CI.)
name: build

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/**'
      - '*.md'
      - 'NOTICE'
      - 'LICENSE'
      - 'renovate.json5'
      - '.github/workflows/renovate.yml'
      - '.github/workflows/upstream-watch.yml'
      - '.github/workflows/scan.yml'
      - '.github/workflows/build-skip.yml'

permissions:
  contents: read

jobs:
  required:
    name: required
    runs-on: ubuntu-24.04
    steps:
      - name: No image-affecting files changed
        run: |
          echo "Only documentation or non-build workflow files changed."
          echo "No image can be affected, so the build matrix is skipped."
          echo "Reporting 'required' as passing so branch protection is satisfied."
