# SPDX-License-Identifier: MPL-2.0
#
# Scan the published images for known vulnerabilities, and open an issue if
# anything turns up.
#
# This scans what's in the registry, not what a build just produced, because
# the question is "is what people are pulling right now affected?". The weekly
# rebuild picks up Alpine fixes, but between rebuilds the published images
# fall behind, and nothing was reporting how far.
#
# Two scans per image, and the second is the important one here:
#   grype on the image      -> apk packages
#   grype on the shipped    -> Kea itself, via the CPE in the SPDX document
#   SPDX document              (D23)
# grype doesn't read the SBOM document inside an image when it scans the
# image. Tested with an image containing a deliberately old Kea: the image
# scan found 0 Kea CVEs, and the document scan found 3. Kea is built from
# source, so without the second scan it wouldn't be checked at all.
#
# Why grype rather than trivy: against an SBOM naming Kea 1.4.0, trivy
# reported nothing (it read no packages from the document at all), while
# grype matched CVE-2018-5739, CVE-2019-6472 and CVE-2019-6474. See D24.
#
# Like upstream-watch.yml, it opens an issue both when it finds something and
# when the check itself breaks. Otherwise a broken scanner would go quiet, and
# quiet looks like a clean bill of health.
name: scan

on:
  schedule:
    # Daily, to catch new CVEs in images that haven't changed. After the
    # Monday rebuild (04:17) and Renovate (05:23) in the schedule, though
    # GitHub often starts scheduled runs hours late, so the order isn't
    # guaranteed. The trigger below is what makes sure fresh builds get
    # scanned.
    - cron: '53 5 * * *'
  # After every build on main that published images: the Monday rebuild,
  # Renovate merges and ordinary pushes. So a scan always follows a publish,
  # and never reports on images that are about to be replaced.
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Pinned by digest (Renovate keeps it up to date), so the scan can't quietly
  # switch to a different version of the tool.
  GRYPE: anchore/grype:v0.119.0@sha256:8c2c9234a345577a6d321a4753aa3ee1276d8975c8452d2344a56b57733ecad3

jobs:
  scan:
    # A failed build published nothing new, so there's nothing new to scan.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan the published images
        id: scan
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/scan
          args=()
          # Collects the reason any image couldn't be scanned. It's passed to
          # --partial, which puts a banner on the report and reports the run
          # as broken even if other images had findings, so a gap in coverage
          # isn't filed under "vulnerabilities found".
          broken=""

          for branch in $(python3 -c "import json;print(' '.join(json.load(open('versions.json'))['branches']))"); do
            kea="$(python3 -c "import json,sys;print(json.load(open('versions.json'))['branches'][sys.argv[1]]['kea'])" "$branch")"
            for img in $(./scripts/matrix.py images "$branch"); do
              ref="${REGISTRY}/${OWNER}/kea-${img}:${branch}"
              echo "::group::scan $ref"

              # 1. the image itself - apk packages
              if ! docker run --rm -v /tmp/grype-db:/.cache "$GRYPE" \
                     "$ref" -o json -q > "/tmp/scan/${img}-${branch}-image.json"; then
                echo "::warning::grype failed on $ref (image)"
                broken="${broken}grype failed scanning $ref (image)"$'\n' 
              fi
              args+=("${ref} (image)=/tmp/scan/${img}-${branch}-image.json")

              # 2. the SPDX document the image ships - Kea itself
              doc="/tmp/scan/${img}-${branch}-kea.spdx.json"
              if docker run --rm --entrypoint cat "$ref" \
                   /usr/share/sbom/kea.spdx.json > "$doc" 2>/dev/null; then
                # Check the document before scanning it. A document grype
                # can't read gives zero findings, which looks exactly like
                # good news.
                if ./test/check-sbom-doc.py "$kea" < "$doc" >/dev/null; then
                  if ! docker run --rm -v /tmp/grype-db:/.cache -v "$doc:/kea.spdx.json:ro" \
                         "$GRYPE" "sbom:/kea.spdx.json" -o json -q \
                         > "/tmp/scan/${img}-${branch}-sbom.json"; then
                    echo "::warning::grype failed on $ref (sbom)"
                    broken="${broken}grype failed scanning $ref (kea sbom)"$'\n' 
                  fi
                  args+=("${ref} (kea sbom)=/tmp/scan/${img}-${branch}-sbom.json")
                else
                  echo "::error::$ref ships an SBOM document that does not validate"
                  broken="${broken}$ref ships an SBOM document that does not validate"$'\n' 
                fi
              else
                echo "::error::$ref does not ship /usr/share/sbom/kea.spdx.json"
                broken="${broken}$ref does not ship /usr/share/sbom/kea.spdx.json"$'\n' 
              fi
              echo "::endgroup::"
            done
          done

          set +e
          ./scripts/scan-report.py "${args[@]}" --threshold High \
            --partial "$broken" --out scan-report.md
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "No findings at High or above." ;;
            1) echo "::warning::the vulnerability scan itself is broken" ;;
            2) echo "::notice::vulnerabilities found in published images" ;;
            *) echo "::error::unexpected exit code $code"; exit 1 ;;
          esac

      - name: Open or update the tracking issue
        if: steps.scan.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.scan.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$CODE" = "1" ]; then
            title="Vulnerability scan is broken"
            labels="scan,bug"
          else
            title="Vulnerabilities found in published images"
            labels="scan,security"
          fi

          gh label create scan --color 1D76DB \
            --description "Raised by the published-image vulnerability scan" 2>/dev/null || true
          gh label create bug --color D73A4A 2>/dev/null || true
          gh label create security --color B60205 \
            --description "Supply-chain or signing-key issue" 2>/dev/null || true

          # One issue, updated by comment, rather than a new one every night.
          existing="$(gh issue list --state open --label scan \
                       --search "$title in:title" --json number --jq '.[0].number // empty')"
          printf '\n---\n\n[Scan run](%s)\n' "$RUN_URL" >> scan-report.md
          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open; commenting instead."
            gh issue comment "$existing" --body-file scan-report.md
          else
            gh issue create --title "$title" --label "$labels" --body-file scan-report.md
          fi
